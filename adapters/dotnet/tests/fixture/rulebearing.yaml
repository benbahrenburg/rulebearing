# The fixture repository every Rulebearing.TestAdapter fixture project cruises: one rule the code
# keeps (db-not-to-ui) and one it breaks (ui-not-to-db, src/ui/view.ts imports src/db/store.ts).
# The fixture projects assert the failing rule's message rather than letting it fail the suite
# (docs/plans/pending/0002-wave-2-dotnet-python-element-rules.md, Step 14).
rules:
  dependencies:
    forbidden:
      - name: ui-not-to-db
        comment: "The UI reaches data through the service layer."
        fix: "Call the service in src/service instead of importing src/db."
        severity: error
        from: { path: "^src/ui/" }
        to: { path: "^src/db/" }
      - name: db-not-to-ui
        comment: "Data never depends on the UI."
        fix: "Move the shared code out of src/ui."
        severity: error
        from: { path: "^src/db/" }
        to: { path: "^src/ui/" }
