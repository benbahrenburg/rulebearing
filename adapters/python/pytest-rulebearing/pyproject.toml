# pytest-rulebearing: one pytest item per Rulebearing rule, failing with the junit message text.
# hatch_version.py stamps the release version and pins `rulebearing` to it; docs/release.md says how
# the release workflow builds and publishes it beside the `rulebearing` wheels.
# Plan: docs/plans/pending/0002-wave-2-dotnet-python-element-rules.md, Step 14 (2H).
# Lint, type-check and test configuration is the root pyproject.toml.
[build-system]
requires = ["hatchling>=1.26", "packaging>=24"]
build-backend = "hatchling.build"

[project]
name = "pytest-rulebearing"
dynamic = ["version", "dependencies"]
description = "Rulebearing architecture rules as pytest tests: one test per rule, failing with the rule's fix"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["pytest", "architecture", "dependencies", "boundaries", "import-linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.entry-points.pytest11]
rulebearing = "pytest_rulebearing.plugin"

[project.urls]
Homepage = "https://github.com/benbahrenburg/rulebearing"
Repository = "https://github.com/benbahrenburg/rulebearing"
Issues = "https://github.com/benbahrenburg/rulebearing/issues"

[tool.hatch.metadata.hooks.custom]
path = "hatch_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_rulebearing"]
