# The test adapters' shared fixture (adapters/fixture/README.md). Each rule exercises one branch
# of the junit message the adapters must reproduce (crates/rb-report/src/junit.rs): more than five
# error violations, a warn-only rule, a vacuous rule, a passing rule and an element rule.
languages:
  python:
    roots: ["py"]
rules:
  dependencies:
    forbidden:
      - name: handlers-not-to-util
        comment: "Handlers reach util through the service layer."
        fix: "Call app.service instead of importing app.util."
        severity: error
        from: { path: "^py/app/h[0-9]\\.py$" }
        to: { path: "^py/app/util\\.py$" }
      - name: api-not-to-util
        comment: "Warn only: the API layer should not need util."
        severity: warn
        from: { path: "^py/api/" }
        to: { path: "^py/app/util\\.py$" }
      - name: nothing-matches
        comment: "Vacuous on purpose: no module lives under py/missing."
        severity: error
        from: { path: "^py/missing/" }
        to: { path: "^py/app/" }
      - name: util-is-a-leaf
        comment: "Passes: util imports nothing."
        severity: error
        from: { path: "^py/app/util\\.py$" }
        to: { path: "^py/api/" }
  elements:
    - name: classes-are-pascal-case
      comment: "One class in the fixture is named in lower case."
      fix: "Rename the class in PascalCase."
      severity: error
      select: { kind: class, language: python }
      should: { haveNameMatching: "^[A-Z]" }
