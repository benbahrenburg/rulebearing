# The shared fixture's second configuration (adapters/fixture/README.md): every dependency rule is
# anonymous, so each is named `unnamed`, and the element rule (which must have a name) is named
# `unnamed` too; the junit reporter tells them apart as `unnamed`, `unnamed#2` and so on (crates/rb-report/src/catalog.rs), and options.outputTo names a file the adapters must
# neither read from nor write, as they always pass `--output-to -`.
options:
  outputTo: "must-not-be-written.txt"
languages:
  python:
    roots: ["py"]
rules:
  dependencies:
    forbidden:
      - comment: "Handlers reach util through the service layer."
        fix: "Call app.service instead of importing app.util."
        severity: error
        from: { path: "^py/app/h[0-9]\\.py$" }
        to: { path: "^py/app/util\\.py$" }
      - comment: "Warn only: the API layer should not need util."
        severity: warn
        from: { path: "^py/api/" }
        to: { path: "^py/app/util\\.py$" }
      - comment: "Passes: util imports nothing."
        severity: error
        from: { path: "^py/app/util\\.py$" }
        to: { path: "^py/api/" }
  elements:
    - name: unnamed
      comment: "One class in the fixture is named in lower case."
      fix: "Rename the class in PascalCase."
      severity: error
      select: { kind: class, language: python }
      should: { haveNameMatching: "^[A-Z]" }
