# Rulebearing workspace.
# Layout and dependency direction are fixed by docs/adr/0010-crate-layout-and-extractor-boundary.md
# and described in docs/architecture.md#crate-layout. The workspace is created by
# docs/plans/pending/0000-wave-0-spike.md (sub-wave 0A).

[workspace]
resolver = "3"
members = [
    "crates/rb-model",
    "crates/rb-config",
    "crates/rb-rules",
    "crates/rb-extract-ts",
    "crates/rb-extract-dotnet",
    "crates/rb-extract-python",
    "crates/rb-ingest",
    "crates/rb-report",
    "crates/rb-cli",
    "crates/rb-node",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/benbahrenburg/rulebearing"
authors = ["Ben Bahrenburg"]
publish = false

[workspace.dependencies]
# Internal crates
rb-model = { path = "crates/rb-model" }
rb-config = { path = "crates/rb-config" }
rb-rules = { path = "crates/rb-rules" }
rb-extract-ts = { path = "crates/rb-extract-ts" }
rb-extract-dotnet = { path = "crates/rb-extract-dotnet" }
rb-extract-python = { path = "crates/rb-extract-python" }
rb-ingest = { path = "crates/rb-ingest" }
rb-report = { path = "crates/rb-report" }
rb-cli = { path = "crates/rb-cli" }
xtask = { path = "xtask" }

# Third-party crates pinned here so every crate uses one version.
# Each is MIT or Apache-2.0 compatible; see docs/adr/0019-mit-licence.md and deny.toml.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
# The graph document's schema is generated from the types (docs/adr/0004). MIT.
schemars = "1"
# The .NET reader (plan 0000, Step 9): solution and project XML, and embedded PDB inflation.
roxmltree = "0.21"
miniz_oxide = "0.9"

# Test-only. Property tests state an invariant and let the runner look for a counterexample
# (docs/adr/0024-test-quality-gates.md). MIT or Apache-2.0, so cargo deny is unaffected.
proptest = "1"
# Layer 4 of gate 1 validates results and configs against the vendored upstream schemas
# (docs/plans/pending/0001-wave-1-typescript-parity.md, Step 12).
jsonschema = { version = "0.57", default-features = false }

# The TypeScript extractor (plan 0000, Step 8). oxc is pinned to exact versions and bumped only by a
# pull request that re-runs conformance gate 1 (docs/adr/0012-oxc-for-typescript.md). All MIT.
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_ast_visit = "=0.151.0"
oxc_diagnostics = "=0.151.0"
oxc_parser = "=0.151.0"
oxc_semantic = "=0.151.0"
oxc_span = "=0.151.0"
# `yarn_pnp` resolves through a Yarn Plug'n'Play manifest for `externalModuleResolutionStrategy:
# yarn-pnp` (plan 0001, sub-wave 1C); it adds the BSD-2-Clause `pnp` crate.
oxc_resolver = { version = "=11.24.3", features = ["yarn_pnp"] }
# Path patterns are regular expressions with linear-time matching only (docs/adr/0016). MIT/Apache-2.0.
regex = "1"
# Workspace and initial-source globs, as picomatch matches them. MIT (dual Unlicense).
globset = "0.4"
# File-level parallelism in the extractors (docs/architecture.md#technology-choices; plan 0001,
# sub-wave 1C). MIT/Apache-2.0.
rayon = "1"

# Wave 1 (docs/plans/pending/0001-wave-1-typescript-parity.md § 1.8). All MIT or MIT/Apache-2.0.
# The configuration evaluator is QuickJS, sandboxed (docs/adr/0006-embedded-quickjs-config-evaluator.md).
rquickjs = { version = "0.14", default-features = false, features = ["std", "loader"] }
# Configuration formats (docs/adr/0005-native-config-superset-and-compat.md).
serde_yaml = "0.9"
toml = "1"
# The JavaScript-pattern compatibility table walks the parsed pattern (docs/adr/0016).
regex-syntax = "0.8"
# `expires` on rules and known violations.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# The command line (docs/architecture.md#technology-choices).
clap = { version = "4", features = ["derive", "wrap_help"] }

# Wave 2+ dependencies are added by the plan that needs them, not in advance:
#   ruff_python_parser              docs/adr/0013-ruff-parser-for-python.md

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
