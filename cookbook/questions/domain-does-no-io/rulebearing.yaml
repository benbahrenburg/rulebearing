$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python: {}
rules:
  dependencies:
    forbidden:
      - name: domain-does-no-io
        comment: "The domain is tested without a database or a network, so it reaches neither, directly or through a chain. plan:0004-wave-4-reach"
        fix: "Load the data in the caller (shop/app.py) and pass the values into the domain function."
        severity: error
        from: { path: "^shop/domain/" }
        to: { path: "^shop/(db|http)/", reachable: true }
        examples:
          forbidden:
            - "shop/domain/invoice.py -> shop/db/session.py"
            - "shop/domain/money.py -> shop/http/client.py"
          allowed:
            - "shop/domain/invoice.py -> shop/domain/money.py"
            - "shop/app.py -> shop/db/session.py"
