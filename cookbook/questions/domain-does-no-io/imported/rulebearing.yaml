# Imported from .importlinter by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: ["."]
rules:
  dependencies:
    forbidden:
      # import-linter contract `domain-no-io` (forbidden): The domain does no I/O
      #   forbidden_modules = shop.db, shop.http
      #   source_modules = shop.domain
      - name: domain-no-io
        comment: "import-linter contract: The domain does no I/O"
        severity: error
        from:
          path: "^shop/domain(/.*)?\\.py$"
        to:
          path: ["^shop/db(/.*)?\\.py$", "^shop/http(/.*)?\\.py$"]
          reachable: true
        graph:
          chainsThrough: "^shop(/.*)?\\.py$"
