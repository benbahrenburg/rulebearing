# Required checks on every pull request.
#
# Coverage floor: docs/adr/0018-test-coverage-threshold.md (70% lines, per crate).
# Licence policy: docs/adr/0019-mit-licence.md.
# Conformance gates: docs/adr/0009-conformance-suites-as-specification.md.
# Link and lint gates: docs/adr/0023-documentation-link-and-lint-gates.md.
# Test-quality gates: docs/adr/0024-test-quality-gates.md.
# Hardening (least privilege, pinned actions, timeouts, MSRV, feature powerset):
#   docs/adr/0025-ci-and-supply-chain-hardening.md.
# Plan: docs/plans/pending/0000-wave-0-spike.md, sub-wave 0A.
#
# Job names are the check names of plan 0000 § 1.5, which the branch ruleset on `main` requires
# and later plans cite as evidence; renaming one means updating the ruleset in the same change.
#
# Every action is pinned to a commit SHA with its tag in a comment. Bump with the dependabot
# configuration in .github/dependabot.yml, never by editing the tag alone.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here writes to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every language's linter must be installed, because `--strict` turns a missing linter into
      # a failure rather than a skip (docs/adr/0023-documentation-link-and-lint-gates.md).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: python -m pip install --quiet ruff mypy
      # One entry point: doc links, rustfmt, clippy, eslint, prettier, ruff, mypy, dotnet format.
      - run: cargo xtask lint --strict

  supply-chain:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-features
      # Doc examples are part of the public contract, so they must compile and run.
      - run: cargo test --workspace --all-features --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Must match `rust-version` in Cargo.toml; the two are compared by the step below.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: declared MSRV matches this job
        run: |
          declared="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          test "$declared" = "1.96" || { echo "::error::Cargo.toml says $declared, this job pins 1.96"; exit 1; }
      # `+1.96` overrides rust-toolchain.toml, which pins the development toolchain. 1.96 is what
      # the pinned oxc crates require (docs/adr/0012-oxc-for-typescript.md).
      - run: cargo +1.96 check --workspace --all-features --all-targets

  features:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-hack
      # Every combination of the three extractor features must build, because a narrower build
      # never linking the others is a promise of ADR-0010.
      - run: cargo hack check --package rb-cli --feature-powerset --no-dev-deps
      # A Python-only build links no TypeScript or .NET extractor code (plan 0000 § 1.3, FR-CORE-01).
      - name: narrow build links only its extractor
        run: |
          tree="$(cargo tree -p rb-cli --no-default-features --features extract-python -e normal)"
          for absent in rb-extract-ts rb-extract-dotnet oxc_parser oxc_resolver; do
            if grep -q "$absent" <<<"$tree"; then echo "::error::$absent linked into a Python-only build"; exit 1; fi
          done
          grep -q rb-extract-python <<<"$tree"

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Catches broken intra-doc links, which the documentation link check cannot see.
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Workspace floor.
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 70 --lcov --output-path lcov.info
      # Per-crate floor: a crate below 70% fails even when the workspace is above it (ADR-0018).
      - run: scripts/coverage-per-crate.sh 70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info

  # The npm wrapper's vitest suite at the 70% line floor of vitest.config.ts (docs/adr/0018), and
  # its build, which release.yml runs before staging (plan 0001, Step 19).
  npm-wrapper:
    name: npm-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build && npm test
        working-directory: wrappers/npm

  # Mutation testing runs in eight shards so the rule engine's mutants fit the time limit; the
  # `mutants` job below is the required check and passes only when every shard did.
  mutants-shard:
    name: mutants shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-mutants
      # Coverage says a line ran; this says a test would notice if it were wrong.
      # Scope and policy: docs/adr/0024-test-quality-gates.md.
      - run: cargo mutants --no-shuffle --package rb-model --package rb-rules --package xtask --shard ${{ matrix.shard }}/8 --jobs 2
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: mutants-shard
    if: always()
    steps:
      - run: test "${{ needs.mutants-shard.result }}" = success

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: typos-cli
      - run: typos

  workflows-and-scripts:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck --severity=style

  conformance-dependency-cruiser:
    name: conformance-gate-1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Layer 1 (recorded test/extract cases, threshold.json) and layer 2 (upstream specs through
      # the shim, excluded.json); conformance/dependency-cruiser/run.sh documents both.
      - run: conformance/dependency-cruiser/run.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer1-report
          path: target/conformance/layer1.md

  # Gate 1, layer 5: the oracle zero-diff over the three repositories plan 0001 names, and the
  # mutation branch. It clones those repositories and installs their dependencies, so it runs on
  # every push to main and nightly, not on pull requests (plan 0001 § 1.11, Operational impact).
  # conformance/dependency-cruiser/scripts/run-layer-5.sh documents the roots and set-up per
  # repository; conformance/divergences.md is the only place a difference may be accepted.
  conformance-layer-5:
    name: conformance-gate-1-layer-5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: cargo build --release -p rb-cli
      - name: oracle zero-diff
        run: conformance/dependency-cruiser/scripts/run-layer-5.sh --all
      - name: mutation branch
        if: success() || failure()
        run: conformance/dependency-cruiser/scripts/run-layer-5.sh --mutations
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer5
          path: target/conformance/layer5
          if-no-files-found: ignore

  conformance-archunitnet:
    name: conformance-gate-2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The committed TestAssembly fixture, its hashes, portable PDB and notice; ported.json.
      - run: scripts/gate2-check.sh

  ratchets:
    name: ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # excluded.json may only shrink, ported and the layer 1 threshold may only rise
      # (docs/adr/0009-conformance-suites-as-specification.md).
      - run: scripts/ratchets.sh

  self-check:
    name: self-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p rb-cli
      # The repository's own rules over its crate graph (Rust is not an extracted language, so
      # scripts/cargo-graph.sh writes the graph document), every rule carrying a decision token
      # (docs/plans/pending/0001-wave-1-typescript-parity.md, Steps 9 and 15).
      - run: scripts/cargo-graph.sh > target/cargo-graph.json
      # Through this repository's own Action (action.yml) with the binary just built; once v0.1.0
      # is released the Action downloads it instead (Step 19).
      - uses: ./
        with:
          binary: ./target/release/rulebearing
          output-type: err-long
          args: --config rulebearing.yaml --require-comment-token --graph target/cargo-graph.json
      # The receipt of that run, then a second computation that must match it.
      - run: ./target/release/rulebearing attest --config rulebearing.yaml --graph target/cargo-graph.json
      - run: ./target/release/rulebearing attest --verify --config rulebearing.yaml --graph target/cargo-graph.json

  schema-check:
    name: schema-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # schema/v1.json is generated from rb-model; a type change without a regenerated schema
      # fails here (docs/adr/0004-graph-document-is-cruise-result-superset.md).
      - run: cargo run -p rb-model --example emit-schema
      - run: git diff --exit-code schema/

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Also runs inside every compile through crates/rb-model/build.rs; this job is the fast,
      # named signal on a pull request (docs/adr/0023-documentation-link-and-lint-gates.md).
      - run: cargo xtask check-links
