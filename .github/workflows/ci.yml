# Required checks on every pull request.
#
# Coverage floor: docs/adr/0018-test-coverage-threshold.md (70% lines, per crate).
# Licence policy: docs/adr/0019-mit-licence.md.
# Conformance gates: docs/adr/0009-conformance-suites-as-specification.md.
# Link and lint gates: docs/adr/0023-documentation-link-and-lint-gates.md.
# Test-quality gates: docs/adr/0024-test-quality-gates.md.
# Hardening (least privilege, pinned actions, timeouts, MSRV, feature powerset):
#   docs/adr/0025-ci-and-supply-chain-hardening.md.
# Plan: docs/plans/pending/0000-wave-0-spike.md, sub-wave 0A.
#
# Job names are the check names of plan 0000 § 1.5, which the branch ruleset on `main` requires
# and later plans cite as evidence; renaming one means updating the ruleset in the same change.
#
# Every action is pinned to a commit SHA with its tag in a comment. Bump with the dependabot
# configuration in .github/dependabot.yml, never by editing the tag alone.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here writes to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every language's linter must be installed, because `--strict` turns a missing linter into
      # a failure rather than a skip (docs/adr/0023-documentation-link-and-lint-gates.md).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: python -m pip install --quiet ruff mypy
      # One entry point: doc links, rustfmt, clippy, eslint, prettier, ruff, mypy, dotnet format.
      - run: cargo xtask lint --strict

  supply-chain:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-features
      # Doc examples are part of the public contract, so they must compile and run.
      - run: cargo test --workspace --all-features --doc

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Must match `rust-version` in Cargo.toml; the two are compared by the step below.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: declared MSRV matches this job
        run: |
          declared="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          test "$declared" = "1.85" || { echo "::error::Cargo.toml says $declared, this job pins 1.85"; exit 1; }
      # `+1.85` overrides rust-toolchain.toml, which pins the development toolchain.
      - run: cargo +1.85 check --workspace --all-features --all-targets

  features:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-hack
      # Every combination of the three extractor features must build, because a narrower build
      # never linking the others is a promise of ADR-0010.
      - run: cargo hack check --package rb-cli --feature-powerset --no-dev-deps
      # A Python-only build links no TypeScript or .NET extractor code (plan 0000 § 1.3, FR-CORE-01).
      - name: narrow build links only its extractor
        run: |
          tree="$(cargo tree -p rb-cli --no-default-features --features extract-python -e normal)"
          for absent in rb-extract-ts rb-extract-dotnet oxc_parser oxc_resolver; do
            if grep -q "$absent" <<<"$tree"; then echo "::error::$absent linked into a Python-only build"; exit 1; fi
          done
          grep -q rb-extract-python <<<"$tree"

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Catches broken intra-doc links, which the documentation link check cannot see.
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Workspace floor.
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 70 --lcov --output-path lcov.info
      # Per-crate floor: a crate below 70% fails even when the workspace is above it (ADR-0018).
      - run: scripts/coverage-per-crate.sh 70
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-mutants
      # Coverage says a line ran; this says a test would notice if it were wrong.
      # Scope and policy: docs/adr/0024-test-quality-gates.md.
      - run: cargo mutants --no-shuffle --package rb-model --package rb-rules --package xtask
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out
          path: mutants.out

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: typos-cli
      - run: typos

  workflows-and-scripts:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck --severity=style

  conformance-dependency-cruiser:
    name: conformance-gate-1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo build --release -p rb-cli
      - run: conformance/dependency-cruiser/run.sh
      # excluded.json may only shrink (ADR-0009).
      - run: conformance/check-ratchet.sh dependency-cruiser

  conformance-archunitnet:
    name: conformance-gate-2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: cargo build --release -p rb-cli
      - run: conformance/archunitnet/run.sh
      - run: conformance/check-ratchet.sh archunitnet

  self-check:
    name: self-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p rb-cli
      # Enforced from wave 1; until `cruise` exists this step is informational.
      - run: ./target/release/rulebearing cruise --config rulebearing.yaml --output-type err crates || echo "::notice::self-check becomes required in wave 1 (docs/plans/pending/0001-wave-1-typescript-parity.md)"
        continue-on-error: true

  schema-check:
    name: schema-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # schema/v1.json is generated from rb-model; a type change without a regenerated schema
      # fails here (docs/adr/0004-graph-document-is-cruise-result-superset.md).
      - run: cargo run -p rb-model --example emit-schema
      - run: git diff --exit-code schema/

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Also runs inside every compile through crates/rb-model/build.rs; this job is the fast,
      # named signal on a pull request (docs/adr/0023-documentation-link-and-lint-gates.md).
      - run: cargo xtask check-links
