# Builds the `rulebearing` binary for the six targets of docs/architecture.md#distribution and, on a
# release tag, attaches them to a GitHub release and publishes every wrapper at the same version:
# npm (`rulebearing`, its six platform packages, and `rulebearing/vitest` inside it; wave 1;
# `eslint-plugin-rulebearing`, wave 2 Step 13), PyPI
# (the six `rulebearing` wheels and `pytest-rulebearing`) and NuGet (the `Rulebearing` dotnet tool
# and whatever else wrappers/nuget/pack.sh packs) (wave 2), and the rule library from presets/ on all
# three (`rulebearing-rules` on npm and PyPI, `Rulebearing.Rules` on NuGet; plan 0003, Step 23;
# docs/adr/0071), packed by wrappers/rules/pack.sh. The 0.0.1 name reservations were a manual,
# one-day procedure in docs/release.md (docs/adr/0020).
#
# Dry run: a tag with any pre-release suffix (`vX.Y.Z-<anything>`, for example v0.2.0-rc.1 or
# v0.2.0-beta.1), or any manual run, builds every target, packs the npm, PyPI and NuGet packages,
# runs each registry's install check from those packages alone, and uploads everything as workflow
# artefacts without releasing or publishing. Only a `vX.Y.Z` tag releases, and only once the
# version check and all three install checks have passed.
# Plans: docs/plans/pending/0000-wave-0-spike.md, Step 11 (binaries);
# docs/plans/implemented/0001-wave-1-typescript-parity.md, Steps 19 (npm) and 22 (schema on Pages);
# docs/plans/implemented/0002-wave-2-dotnet-python-element-rules.md, Steps 13 (eslint-plugin-rulebearing)
# and 14 (PyPI, NuGet).
# Hardening: docs/adr/0025. The npm credentials and publish jobs hold id-token: write (trusted
# publishing and provenance, docs/adr/0069), the NuGet
# credentials and publish jobs hold id-token: write (trusted publishing, docs/adr/0068) and the
# schema Pages job holds pages: write and id-token: write (deploy-pages); the PyPI publish job
# pushes with a repository secret and keeps contents: read.
name: release

on:
  push:
    tags: ["v*"]
  # A manual run is always a dry run: the release and publish jobs run only for a pushed tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Linux targets other than the host's get a cross linker; the others build natively.
      - if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p rb-cli --target ${{ matrix.target }}
      # The Node addon behind the npm package's programmatic API (plan 0003, Step 22). A shared
      # library cannot link musl statically, so that target links the C runtime dynamically, as
      # Node on Alpine does.
      - name: build the Node addon
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=-crt-static"
          fi
          cargo build --release --locked -p rb-node --target "$TARGET"
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rulebearing"
          [ "$RUNNER_OS" = "Windows" ] && binary="rulebearing.exe"
          case "$RUNNER_OS" in
            Windows) library="rb_node.dll" ;;
            macOS) library="librb_node.dylib" ;;
            *) library="librb_node.so" ;;
          esac
          mkdir -p dist
          cp "target/$TARGET/release/$binary" "dist/$binary"
          cp "target/$TARGET/release/$library" dist/rulebearing.node
          cp LICENSE README.md dist/
          (cd dist && tar -czf "../rulebearing-$TARGET.tar.gz" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulebearing-${{ matrix.target }}
          path: rulebearing-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    # The tag carries the workspace version and every registry's packages installed and ran, so a
    # release never exists for packages that cannot be published.
    needs: [binaries, version, npm-install-check, pypi-install-check, nuget-install-check]
    # Only a real tag releases: not a manual run, not a tag with a pre-release suffix.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # The workspace version is the release version (docs/release.md); a tag must carry it. Every
  # registry's packages are stamped with this one value (FR-DIST-01).
  version:
    name: release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$REF_TYPE" = tag ]; then
            case "${REF_NAME#v}" in
              "$version" | "$version"-*) ;;
              *) echo "::error::tag $REF_NAME does not carry the workspace version $version"; exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A manual run proves npm trusted publishing without publishing anything (docs/adr/0069). The
  # first step republishes the `rulebearing` 0.0.1 tarball already on npm with no token configured:
  # npm exchanges the job's OIDC token for a publish token only when the package's trust setting
  # names this repository and release.yml, and the registry then refuses the version as already
  # published. Without a matching trust setting npm has no credential and fails with ENEEDAUTH
  # instead, so the error tells the two apart, and nothing new is published. Provenance is off so
  # the failed attempt leaves no transparency-log entry. The second step checks NPM_TOKEN, which
  # only a package without a trust setting needs: one the release creates for the first time.
  npm-credentials:
    name: npm credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global --no-audit --no-fund npm@11.21.0
      - name: republish the published rulebearing 0.0.1 through the trust setting
        run: |
          npm pack --silent rulebearing@0.0.1 > /dev/null
          if out="$(npm publish ./rulebearing-0.0.1.tgz --access public --provenance=false 2>&1)"; then
            echo "$out"
            echo "::error::rulebearing 0.0.1 was accepted as a new publish"
            exit 1
          fi
          echo "$out"
          if ! grep -q "previously published" <<< "$out"; then
            echo "::error::npm did not reach the publish check: no trust setting on rulebearing matches benbahrenburg/rulebearing and release.yml (npm trust list rulebearing)"
            exit 1
          fi
      - name: NPM_TOKEN, for packages with no trust setting yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set: every package the release publishes must have a trust setting"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm whoami --userconfig "$RUNNER_TEMP/.npmrc"
      # npm cannot set trust on a package that does not exist, so the rule library's first publish
      # is made once from the maintainer's session (docs/adr/0071, docs/release.md).
      - name: rulebearing-rules on npm
        run: |
          if ! npm view rulebearing-rules name > /dev/null 2>&1; then
            echo "::warning::rulebearing-rules is not on npm: its first publish is from the maintainer's session with 2FA, then npm trust github (docs/release.md, the rule library)"
          fi

  npm-pack:
    name: npm packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build
        working-directory: wrappers/npm
      # Six platform packages and the main package, version stamped (wrappers/npm/src/stage.ts).
      - run: node wrappers/npm/scripts/stage.mjs dist "$VERSION" staged
        env:
          VERSION: ${{ needs.version.outputs.version }}
      # eslint-plugin-rulebearing, built against the wrapper's declarations and staged beside the
      # wrapper with the release version stamped into it and into its `rulebearing` dependency;
      # the source tree's package.json is copied, never edited.
      - name: stage eslint-plugin-rulebearing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          plugin=frontends/eslint-plugin-rulebearing
          (cd "$plugin" && npm run build)
          dir=staged/eslint-plugin-rulebearing
          rm -rf "$dir"
          mkdir -p "$dir/dist"
          cp "$plugin"/dist/*.js "$plugin"/dist/*.d.ts "$dir/dist/"
          cp "$plugin/package.json" "$plugin/README.md" LICENSE "$dir/"
          (cd "$dir" && npm pkg set "version=$VERSION" "dependencies.rulebearing=$VERSION" && npm pkg delete scripts)
      - name: pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir packages
          for dir in staged/*/; do npm pack "./$dir" --pack-destination packages; done
          # The rule library, rulebearing-rules, from presets/ (docs/adr/0071).
          wrappers/rules/pack.sh "$VERSION" packages npm
          ls -l packages
      # The publish step's own command, as a dry run on every trigger (no credentials needed), so
      # a dry run proves the publish command line and not only the tarballs.
      - name: publish dry run
        run: for tarball in ./packages/*.tgz; do npm publish --dry-run --access public "$tarball"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: packages/*.tgz
          if-no-files-found: error

  # The install matrix of plan 0001 Step 19: install the packed tarballs into an empty project and
  # run the command npm puts on the path. Runs on every trigger, so a dry run proves it too.
  npm-install-check:
    name: npx rulebearing (${{ matrix.os }})
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, package: rulebearing-cli-darwin-arm64 }
          - { os: ubuntu-latest, package: rulebearing-cli-linux-x64-gnu }
          - { os: windows-latest, package: rulebearing-cli-win32-x64-msvc }
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.npm-pack.outputs.version }}
          PLATFORM_PACKAGE: ${{ matrix.package }}
        run: |
          packages="$PWD/packages"
          project="$RUNNER_TEMP/npx-check"
          mkdir -p "$project"
          cd "$project"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$packages/rulebearing-$VERSION.tgz" "$packages/$PLATFORM_PACKAGE-$VERSION.tgz"
          out="$(npx --no-install rulebearing --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"
          # The rulebearing/vitest entry point resolves from the installed package, with vitest as
          # its peer (plan 0002, Step 14: `npm install rulebearing/vitest` works).
          npm install --no-audit --no-fund vitest@5
          node --input-type=module -e "const m = await import('rulebearing/vitest'); if (typeof m.defineArchitectureTests !== 'function' || typeof m.RulebearingReporter !== 'function') { console.error('rulebearing/vitest exports are missing'); process.exit(1); }"
          # The programmatic API loads the platform package's addon and cruises (plan 0003, Step 22).
          mkdir -p src
          printf 'export const a = 1;\n' > src/a.js
          printf "import { a } from './a.js';\nexport const b = a;\n" > src/b.js
          node --input-type=module -e "const { cruise, allExtensions } = await import('rulebearing'); const r = await cruise(['src'], {}); if (r.output.summary.totalCruised !== 2 || !allExtensions.some((e) => e.extension === '.ts' && e.available)) { console.error(JSON.stringify(r.output.summary)); process.exit(1); }"
      # The rule library (plan 0003, Step 23): `extends: rulebearing-rules/nextjs` is refused before
      # rulebearing-rules is installed from the built tarball and resolves from node_modules after,
      # so `rulebearing test` runs the preset's examples.
      - name: rulebearing-rules resolves from node_modules
        shell: bash
        env:
          VERSION: ${{ needs.npm-pack.outputs.version }}
          PLATFORM_PACKAGE: ${{ matrix.package }}
        run: |
          packages="$PWD/packages"
          project="$RUNNER_TEMP/rules-check"
          mkdir -p "$project"
          cd "$project"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$packages/rulebearing-$VERSION.tgz" "$packages/$PLATFORM_PACKAGE-$VERSION.tgz"
          printf 'extends: rulebearing-rules/nextjs\n' > rulebearing.yaml
          status=0
          npx --no-install rulebearing test > before.out 2>&1 || status=$?
          cat before.out
          test "$status" -eq 3
          npm install --no-audit --no-fund "$packages/rulebearing-rules-$VERSION.tgz"
          npx --no-install rulebearing test | tee after.out
          grep -q "nextjs-no-import-of-route-entries" after.out
          grep -q " 0 failing" after.out

  npm-publish:
    name: npm publish
    needs: [npm-pack, npm-install-check, release]
    # Only a real tag publishes: not a manual run, not a pre-release tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job's OIDC token does two things (plan 0001, Step 19; docs/adr/0069): npm exchanges it
    # for a publish token for every package whose trust setting names this repository and
    # release.yml, and `--provenance` signs with it. A package with no trust setting yet, which is
    # one this release creates, falls back to NPM_TOKEN. Every other job stays at contents: read
    # (docs/adr/0025).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global --no-audit --no-fund npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages
      # The six platform packages first, so the main package never points at a missing version.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.npm-pack.outputs.version }}
        run: |
          shopt -s nullglob
          # `./` matters: npm reads a bare `packages/<file>.tgz` as a GitHub `owner/repo` shorthand
          # and tries to clone it, which failed the v0.1.0 run before anything was published.
          platforms=(./packages/rulebearing-cli-*-"$VERSION".tgz)
          if [ "${#platforms[@]}" -ne 6 ]; then
            echo "::error::expected 6 platform packages, found ${#platforms[@]}"
            exit 1
          fi
          # A version already on the registry is skipped, so re-running after a partial publish
          # finishes the release instead of failing on the packages that made it.
          publish() { # tarball
            local name
            name="$(basename "$1" "-$VERSION.tgz")"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipped"
            else
              npm publish "$1" --provenance --access public
            fi
          }
          for tarball in "${platforms[@]}"; do
            publish "$tarball"
          done
          publish "./packages/rulebearing-$VERSION.tgz"
          # The plugin next: it depends on `rulebearing` at the same version.
          publish "./packages/eslint-plugin-rulebearing-$VERSION.tgz"
          # The rule library last (docs/adr/0071). npm cannot set trust on a package that does not
          # exist, so the first rulebearing-rules publish is the maintainer's, from a session with
          # 2FA; without NPM_TOKEN this fails until then, and says what to do.
          library="./packages/rulebearing-rules-$VERSION.tgz"
          if npm view "rulebearing-rules@$VERSION" version > /dev/null 2>&1; then
            echo "rulebearing-rules@$VERSION is already published; skipped"
          elif out="$(npm publish "$library" --provenance --access public 2>&1)"; then
            echo "$out"
          else
            echo "$out"
            if grep -qE "ENEEDAUTH|E404" <<< "$out"; then
              echo "::error::rulebearing-rules has no trust setting on npm: npm cannot trust a package that does not exist, so its first publish is made once from the maintainer's session with 2FA (npm publish of rulebearing-rules-$VERSION.tgz from this run's npm-packages artefact, then npm trust github rulebearing-rules), after which this job is rerun (docs/release.md, the rule library; docs/adr/0071)"
            fi
            exit 1
          fi

  # PyPI (plan 0002, Step 14): one `rulebearing` wheel per release target, the binary in the package
  # data, and the `pytest-rulebearing` wheel pinned to it, all at the release version
  # (wrappers/pip/scripts/build-wheels.sh), and the rule library's wheel and source distribution,
  # `rulebearing-rules` (wrappers/rules/pack.sh; plan 0003, Step 23). Runs on every trigger;
  # `twine check` validates the metadata PyPI will read.
  pypi-build:
    name: PyPI packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: python -m pip install --quiet build==1.6.1 hatchling==1.32.4 packaging==26.3 twine==7.0.0
      - run: wrappers/pip/scripts/build-wheels.sh dist "$VERSION" pypi
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PYTHON: python
      - run: wrappers/rules/pack.sh "$VERSION" pypi pypi
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PYTHON: python
      - name: check
        run: |
          count="$(find pypi -name 'rulebearing-*.whl' | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "::error::expected 6 rulebearing wheels, found $count"
            exit 1
          fi
          count="$(find pypi -name 'rulebearing_rules-*' | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected the rulebearing-rules wheel and source distribution, found $count files"
            exit 1
          fi
          python -m twine check --strict pypi/*.whl pypi/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-packages
          path: |
            pypi/*.whl
            pypi/*.tar.gz
          if-no-files-found: error

  # The smoke job of plan 0002 Step 14 for PyPI: install the built wheels into a new virtual
  # environment on each host, run the console script, then run pytest-rulebearing over the shared
  # adapter fixture, whose five rules must give three failures and two passes.
  pypi-install-check:
    name: pip install rulebearing (${{ matrix.os }})
    needs: [pypi-build, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: adapters/fixture
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-packages
          path: pypi
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          scripts="$RUNNER_TEMP/venv/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then scripts="$RUNNER_TEMP/venv/Scripts"; fi
          # pytest, their one other dependency, from PyPI first; then the two packages from the built
          # wheels alone (--no-index), so a rerun after a publish never checks the registry's copy.
          "$scripts/python" -m pip install --quiet "pytest>=8"
          "$scripts/python" -m pip install --quiet --no-index --find-links pypi "rulebearing==$VERSION" "pytest-rulebearing==$VERSION"
          out="$("$scripts/rulebearing" --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"
          project="$RUNNER_TEMP/pytest-check"
          cp -R adapters/fixture "$project"
          printf '[pytest]\nrulebearing = true\n' > "$project/pytest.ini"
          cd "$project"
          status=0
          "$scripts/python" -m pytest -q -p no:cacheprovider > pytest.out 2>&1 || status=$?
          cat pytest.out
          test "$status" -eq 1
          grep -q "3 failed, 2 passed" pytest.out
          grep -q "is vacuous: its from side matched nothing" pytest.out
      # The rule library (plan 0003, Step 23): `extends: rulebearing-rules/nextjs` is refused before
      # rulebearing-rules is installed from the built wheel alone and resolves from the virtual
      # environment's site-packages after, so `rulebearing test` runs the preset's examples.
      - name: rulebearing-rules resolves from site-packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts="$RUNNER_TEMP/venv/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then scripts="$RUNNER_TEMP/venv/Scripts"; fi
          wheels="$PWD/pypi"
          project="$RUNNER_TEMP/rules-check"
          mkdir -p "$project"
          printf 'extends: rulebearing-rules/nextjs\n' > "$project/rulebearing.yaml"
          # The variable is read by the binary, not bash: on Windows it needs the native path.
          VIRTUAL_ENV="$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then VIRTUAL_ENV="$(cygpath -w "$VIRTUAL_ENV")"; fi
          export VIRTUAL_ENV
          cd "$project"
          status=0
          "$scripts/rulebearing" test > before.out 2>&1 || status=$?
          cat before.out
          test "$status" -eq 3
          "$scripts/python" -m pip install --quiet --no-index --find-links "$wheels" "rulebearing-rules==$VERSION"
          "$scripts/rulebearing" test | tee after.out
          grep -q "nextjs-no-import-of-route-entries" after.out
          grep -q " 0 failing" after.out

  pypi-publish:
    name: PyPI publish
    needs: [pypi-build, pypi-install-check, release]
    # Only a real tag publishes: not a manual run, not a pre-release tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # twine with the PYPI_TOKEN repository secret; no OIDC token is requested, so this job keeps
    # the workflow's contents: read (docs/adr/0025).
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-packages
          path: pypi
      - run: python -m pip install --quiet twine==7.0.0
      # The rulebearing wheels first, so pytest-rulebearing never pins a version PyPI lacks.
      # --skip-existing lets a rerun after a partial upload finish the release.
      - name: publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload --non-interactive --skip-existing pypi/rulebearing-*.whl
          python -m twine upload --non-interactive --skip-existing pypi/pytest_rulebearing-*.whl
          # The rule library, its wheel and source distribution (docs/adr/0071).
          python -m twine upload --non-interactive --skip-existing pypi/rulebearing_rules-*

  # A manual run proves PYPI_TOKEN without publishing anything: it re-uploads the `rulebearing`
  # 0.0.1 wheel already on PyPI with --skip-existing. PyPI checks the token and its project scope
  # before it looks at the file, so a missing, revoked or wrongly scoped token fails this job,
  # and the existing file means nothing new is published. No upload can prove the token covers a
  # project not on PyPI yet (`pytest-rulebearing`, `rulebearing-rules`) without creating it; the
  # job warns until each exists (docs/release.md § PyPI).
  pypi-credentials:
    name: PyPI credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet twine==7.0.0
      - name: re-upload the published rulebearing 0.0.1 wheel
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "$TWINE_PASSWORD" || { echo "::error::the PYPI_TOKEN secret is not set"; exit 1; }
          python -m pip download --quiet --no-deps --only-binary=:all: --dest existing rulebearing==0.0.1
          python -m twine upload --non-interactive --skip-existing existing/rulebearing-0.0.1-py3-none-any.whl
      - name: pytest-rulebearing and rulebearing-rules on PyPI
        run: |
          for project in pytest-rulebearing rulebearing-rules; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$project/json")"
            if [ "$code" != 200 ]; then
              echo "::warning::$project is not on PyPI (HTTP $code): a token scoped to projects cannot cover it yet, so the first release needs an account-wide token or the name reserved first (docs/release.md)"
            fi
          done

  # A manual run proves trusted publishing without publishing anything: it exchanges the job's
  # OIDC token for a short-lived key exactly as nuget-publish does, then pushes the `Rulebearing`
  # 0.0.1 package already on nuget.org with --skip-duplicate. The exchange fails when no policy on
  # nuget.org matches this repository and workflow or NUGET_USER names the wrong account, and
  # nuget.org checks the key's package scope before it reports the duplicate, so the duplicate
  # means nothing new is published. The seven `Rulebearing.TestAdapter*` packages and
  # `Rulebearing.Analyzer` are not on nuget.org yet; the policy's glob must cover them with "push
  # new packages", which no push can prove without creating one (docs/release.md § NuGet,
  # docs/adr/0068).
  nuget-credentials:
    name: NuGet credentials
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The OIDC token is exchanged for the short-lived key that nuget-publish uses (docs/adr/0068).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: push the published Rulebearing 0.0.1 package again
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "::error::the trusted-publishing exchange returned no key"; exit 1; }
          curl -fsSL -o rulebearing.0.0.1.nupkg https://api.nuget.org/v3-flatcontainer/rulebearing/0.0.1/rulebearing.0.0.1.nupkg
          dotnet nuget push rulebearing.0.0.1.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # NuGet (plan 0002, Step 14): wrappers/nuget/pack.sh turns the six release archives into the
  # `Rulebearing` dotnet tool (the binaries under runtimes/<rid>/native/ and the launcher) and any
  # other package it owns, at the release version, the rule library `Rulebearing.Rules` among them
  # (plan 0003, Step 23). Its contract is in docs/release.md.
  nuget-pack:
    name: NuGet packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - name: pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ ! -x wrappers/nuget/pack.sh ]; then
            echo "::error::wrappers/nuget/pack.sh is missing; it is the NuGet packing entry point docs/release.md names"
            exit 1
          fi
          wrappers/nuget/pack.sh dist "$VERSION" nuget
          for id in Rulebearing Rulebearing.Rules; do
            if [ ! -f "nuget/$id.$VERSION.nupkg" ]; then
              echo "::error::pack.sh did not write nuget/$id.$VERSION.nupkg"
              exit 1
            fi
          done
          ls -l nuget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: nuget/*.nupkg
          if-no-files-found: error

  # The smoke job of plan 0002 Step 14 for NuGet: install the tool from the built package into a
  # tool path on each host and run it; then build against the analyzer package.
  nuget-install-check:
    name: dotnet tool install Rulebearing (${{ matrix.os }})
    needs: [nuget-pack, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nuget
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools="$RUNNER_TEMP/tools"
          # The built package alone: a nuget.config that clears every other source (nuget.org
          # included) and an empty package cache, so a rerun after a publish never installs the
          # registry's copy.
          config="$RUNNER_TEMP/nuget.config"
          source="$PWD/nuget"
          # The file is read by dotnet, not bash: on Windows it needs the native path.
          if [ "$RUNNER_OS" = "Windows" ]; then source="$(cygpath -w "$source")"; fi
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="built" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$config"
          export NUGET_PACKAGES="$RUNNER_TEMP/nuget-packages"
          dotnet tool install Rulebearing --version "$VERSION" --tool-path "$tools" --configfile "$config"
          out="$("$tools/rulebearing" --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"
      # Rulebearing.Analyzer (plan 0003, Step 21) from the same built packages: a class library
      # outside any checkout references it with a rule its one class breaks, so the build must
      # fail with RB0002 and the rule's fix as the message.
      - name: analyzer reports in a build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          work="$RUNNER_TEMP/analyzer-consumer"
          mkdir -p "$work"
          source="$PWD/nuget"
          if [ "$RUNNER_OS" = "Windows" ]; then source="$(cygpath -w "$source")"; fi
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="built" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$work/nuget.config"
          printf '<Project Sdk="Microsoft.NET.Sdk">\n  <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include="Rulebearing.Analyzer" Version="%s" PrivateAssets="all" />\n    <AdditionalFiles Include="rulebearing.yaml" />\n  </ItemGroup>\n</Project>\n' "$VERSION" > "$work/Consumer.csproj"
          printf 'rules:\n  elements:\n    - name: sealed\n      fix: Seal the class.\n      select: { kind: class }\n      should: { beSealed: true }\n' > "$work/rulebearing.yaml"
          printf 'namespace Consumer { public class Open { } }\n' > "$work/Open.cs"
          export NUGET_PACKAGES="$RUNNER_TEMP/nuget-packages-analyzer"
          if out="$(dotnet build "$work/Consumer.csproj" --configfile "$work/nuget.config" 2>&1)"; then
            echo "$out"
            echo "::error::Rulebearing.Analyzer $VERSION did not fail a build that breaks a rule"
            exit 1
          fi
          if ! grep -q "error RB0002: Seal the class." <<<"$out"; then
            echo "$out"
            echo "::error::Rulebearing.Analyzer $VERSION reported no RB0002"
            exit 1
          fi
          echo "Rulebearing.Analyzer $VERSION reported RB0002"
      # The rule library (plan 0003, Step 23): `extends: rulebearing-rules/nextjs` is refused before
      # a project outside any checkout restores Rulebearing.Rules from the built packages alone, and
      # resolves from the global packages folder after, so `rulebearing test`, run by the tool
      # installed above, runs the preset's examples.
      - name: Rulebearing.Rules resolves from the global packages folder
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools="$RUNNER_TEMP/tools"
          work="$RUNNER_TEMP/rules-consumer"
          mkdir -p "$work"
          source="$PWD/nuget"
          if [ "$RUNNER_OS" = "Windows" ]; then source="$(cygpath -w "$source")"; fi
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="built" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$work/nuget.config"
          printf '<Project Sdk="Microsoft.NET.Sdk">\n  <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include="Rulebearing.Rules" Version="%s" />\n  </ItemGroup>\n</Project>\n' "$VERSION" > "$work/Consumer.csproj"
          printf 'extends: rulebearing-rules/nextjs\n' > "$work/rulebearing.yaml"
          packages="$RUNNER_TEMP/nuget-packages-rules"
          # Read by dotnet and by the binary, not bash: on Windows it needs the native path.
          NUGET_PACKAGES="$packages"
          if [ "$RUNNER_OS" = "Windows" ]; then NUGET_PACKAGES="$(cygpath -w "$packages")"; fi
          export NUGET_PACKAGES
          cd "$work"
          status=0
          "$tools/rulebearing" test > before.out 2>&1 || status=$?
          cat before.out
          test "$status" -eq 3
          dotnet restore Consumer.csproj --configfile nuget.config
          test -f "$packages/rulebearing.rules/$VERSION/rulebearing-rules/nextjs.yaml"
          "$tools/rulebearing" test | tee after.out
          grep -q "nextjs-no-import-of-route-entries" after.out
          grep -q " 0 failing" after.out

  nuget-publish:
    name: NuGet publish
    needs: [nuget-pack, nuget-install-check, release]
    # Only a real tag publishes: not a manual run, not a pre-release tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing (docs/adr/0068): the job's OIDC token is exchanged for a NuGet key that
    # lasts an hour, under the nuget.org policy for this repository and release.yml, whose glob is
    # Rulebearing*. That key pushes new versions of packages the policy's owner already owns, but
    # nuget.org refuses it (403) for a package ID that does not exist yet, so a package's first push
    # falls back to the NUGET_API_KEY secret (docs/adr/0070). id-token: write is this job's only
    # addition to contents: read (docs/adr/0025).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nuget
      - name: exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      # --skip-duplicate lets a rerun after a partial push finish the release.
      - name: publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_FIRST_PUSH_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          source=https://api.nuget.org/v3/index.json
          for package in nuget/*.nupkg; do
            if out="$(dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate 2>&1)"; then
              echo "$out"
              continue
            fi
            echo "$out"
            if ! grep -q "403" <<< "$out"; then
              exit 1
            fi
            # A 403 on a valid trusted-publishing key is a package ID nuget.org does not have yet.
            if [ -z "$NUGET_FIRST_PUSH_KEY" ]; then
              echo "::error::$(basename "$package") is a new package ID: its first push needs the NUGET_API_KEY secret (docs/adr/0070)"
              exit 1
            fi
            echo "::notice::$(basename "$package"): first push of a new package ID, with NUGET_API_KEY"
            dotnet nuget push "$package" --api-key "$NUGET_FIRST_PUSH_KEY" --source "$source" --skip-duplicate
          done

  # The two schemas at the `$id` they carry, https://benbahrenburg.github.io/rulebearing/schema/
  # (schema/README.md; plan 0001, Step 22). Served from the tag, so the URL holds the released
  # contract and not work in progress on main. The repository's Pages source must be "GitHub
  # Actions" and the github-pages environment must admit `v*` tags.
  schema-pages:
    name: schema on Pages
    needs: [release]
    # Only a real tag deploys: not a manual run, not a pre-release tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deploy-pages authenticates with the job's OIDC token and writes the Pages site, so this job
    # alone holds pages: write (docs/adr/0025 keeps every other job at contents: read).
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}schema/v1.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p site/schema && cp schema/v1.json schema/config-v1.json site/schema/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
