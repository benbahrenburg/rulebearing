# One tag releases the binary and the three wrappers with the same version
# (docs/architecture.md#distribution, docs/adr/0020-single-name-across-registries.md).
# Plan: docs/plans/pending/0000-wave-0-spike.md, sub-wave 0E (placeholder 0.0.1), then wave 1 (npm), wave 2 (NuGet, pip).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p rb-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rulebearing-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rulebearing*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
      - name: npm
        run: wrappers/npm/publish.sh "$GITHUB_REF_NAME"
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - name: NuGet
        run: wrappers/nuget/publish.sh "$GITHUB_REF_NAME"
        env: { NUGET_API_KEY: "${{ secrets.NUGET_API_KEY }}" }
      - name: PyPI
        run: wrappers/pip/publish.sh "$GITHUB_REF_NAME"
      - name: crates.io
        run: cargo publish -p rb-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" || echo "::notice::crates.io publish is enabled in wave 0E"
