# Builds the `rulebearing` binary for the six targets of docs/architecture.md#distribution and, on a
# release tag, attaches them to a GitHub release and publishes every wrapper at the same version:
# npm (`rulebearing`, its six platform packages, and `rulebearing/vitest` inside it; wave 1), PyPI
# (the six `rulebearing` wheels and `pytest-rulebearing`) and NuGet (the `Rulebearing` dotnet tool
# and whatever else wrappers/nuget/pack.sh packs) (wave 2). The 0.0.1 name reservations were a
# manual, one-day procedure in docs/release.md (docs/adr/0020).
#
# Dry run: a tag ending in `-rc.N` (for example v0.0.1-rc.1), or a manual run with `dry_run` left
# on, builds every target, packs the npm, PyPI and NuGet packages, runs each registry's install
# check from those packages, and uploads everything as workflow artefacts without releasing or
# publishing.
# Plans: docs/plans/pending/0000-wave-0-spike.md, Step 11 (binaries);
# docs/plans/pending/0001-wave-1-typescript-parity.md, Step 19 (npm);
# docs/plans/pending/0002-wave-2-dotnet-python-element-rules.md, Step 14 (PyPI, NuGet).
# Hardening: docs/adr/0025. Only the npm publish job holds id-token: write (provenance); the PyPI
# and NuGet publish jobs push with repository secrets and keep contents: read.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target without creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Linux targets other than the host's get a cross linker; the others build natively.
      - if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p rb-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rulebearing"
          [ "$RUNNER_OS" = "Windows" ] && binary="rulebearing.exe"
          mkdir -p dist
          cp "target/$TARGET/release/$binary" "dist/$binary"
          cp LICENSE README.md dist/
          (cd dist && tar -czf "../rulebearing-$TARGET.tar.gz" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulebearing-${{ matrix.target }}
          path: rulebearing-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: binaries
    # Only a real tag releases: not a manual run, not an -rc tag.
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # The workspace version is the release version (docs/release.md); a tag must carry it. Every
  # registry's packages are stamped with this one value (FR-DIST-01).
  version:
    name: release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$REF_TYPE" = tag ]; then
            case "${REF_NAME#v}" in
              "$version" | "$version"-rc.*) ;;
              *) echo "::error::tag $REF_NAME does not carry the workspace version $version"; exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm-pack:
    name: npm packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build
        working-directory: wrappers/npm
      # Six platform packages and the main package, version stamped (wrappers/npm/src/stage.ts).
      - run: node wrappers/npm/scripts/stage.mjs dist "$VERSION" staged
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: pack
        run: |
          mkdir packages
          for dir in staged/*/; do npm pack "./$dir" --pack-destination packages; done
          ls -l packages
      # The publish step's own command, as a dry run on every trigger (no credentials needed), so
      # a dry run proves the publish command line and not only the tarballs.
      - name: publish dry run
        run: for tarball in ./packages/*.tgz; do npm publish --dry-run --access public "$tarball"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: packages/*.tgz
          if-no-files-found: error

  # The install matrix of plan 0001 Step 19: install the packed tarballs into an empty project and
  # run the command npm puts on the path. Runs on every trigger, so a dry run proves it too.
  npm-install-check:
    name: npx rulebearing (${{ matrix.os }})
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, package: rulebearing-cli-darwin-arm64 }
          - { os: ubuntu-latest, package: rulebearing-cli-linux-x64-gnu }
          - { os: windows-latest, package: rulebearing-cli-win32-x64-msvc }
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.npm-pack.outputs.version }}
          PLATFORM_PACKAGE: ${{ matrix.package }}
        run: |
          packages="$PWD/packages"
          project="$RUNNER_TEMP/npx-check"
          mkdir -p "$project"
          cd "$project"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$packages/rulebearing-$VERSION.tgz" "$packages/$PLATFORM_PACKAGE-$VERSION.tgz"
          out="$(npx --no-install rulebearing --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"
          # The rulebearing/vitest entry point resolves from the installed package, with vitest as
          # its peer (plan 0002, Step 14: `npm install rulebearing/vitest` works).
          npm install --no-audit --no-fund vitest@5
          node --input-type=module -e "const m = await import('rulebearing/vitest'); if (typeof m.defineArchitectureTests !== 'function' || typeof m.RulebearingReporter !== 'function') { console.error('rulebearing/vitest exports are missing'); process.exit(1); }"

  npm-publish:
    name: npm publish
    needs: [npm-pack, npm-install-check, release]
    # Only a real tag publishes: not a manual run, not an -rc tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `npm publish --provenance` signs with the job's OIDC token, so this job alone may request
    # one (plan 0001, Step 19; docs/adr/0025 keeps every other job at contents: read).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages
      # The six platform packages first, so the main package never points at a missing version.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.npm-pack.outputs.version }}
        run: |
          shopt -s nullglob
          # `./` matters: npm reads a bare `packages/<file>.tgz` as a GitHub `owner/repo` shorthand
          # and tries to clone it, which failed the v0.1.0 run before anything was published.
          platforms=(./packages/rulebearing-cli-*-"$VERSION".tgz)
          if [ "${#platforms[@]}" -ne 6 ]; then
            echo "::error::expected 6 platform packages, found ${#platforms[@]}"
            exit 1
          fi
          # A version already on the registry is skipped, so re-running after a partial publish
          # finishes the release instead of failing on the packages that made it.
          publish() { # tarball
            local name
            name="$(basename "$1" "-$VERSION.tgz")"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipped"
            else
              npm publish "$1" --provenance --access public
            fi
          }
          for tarball in "${platforms[@]}"; do
            publish "$tarball"
          done
          publish "./packages/rulebearing-$VERSION.tgz"

  # PyPI (plan 0002, Step 14): one `rulebearing` wheel per release target, the binary in the package
  # data, and the `pytest-rulebearing` wheel pinned to it, all at the release version
  # (wrappers/pip/scripts/build-wheels.sh). Runs on every trigger; `twine check` validates the
  # metadata PyPI will read.
  pypi-build:
    name: PyPI packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - run: python -m pip install --quiet build==1.6.1 hatchling==1.32.4 packaging==26.3 twine==7.0.0
      - run: wrappers/pip/scripts/build-wheels.sh dist "$VERSION" pypi
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PYTHON: python
      - name: check
        run: |
          count="$(find pypi -name 'rulebearing-*.whl' | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "::error::expected 6 rulebearing wheels, found $count"
            exit 1
          fi
          python -m twine check --strict pypi/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-packages
          path: pypi/*.whl
          if-no-files-found: error

  # The smoke job of plan 0002 Step 14 for PyPI: install the built wheels into a new virtual
  # environment on each host, run the console script, then run pytest-rulebearing over the shared
  # adapter fixture, whose five rules must give three failures and two passes.
  pypi-install-check:
    name: pip install rulebearing (${{ matrix.os }})
    needs: [pypi-build, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: adapters/fixture
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-packages
          path: pypi
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          scripts="$RUNNER_TEMP/venv/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then scripts="$RUNNER_TEMP/venv/Scripts"; fi
          # The two packages from the built wheels only; pytest, their one other dependency, from PyPI.
          "$scripts/python" -m pip install --quiet --no-index --find-links pypi "rulebearing==$VERSION"
          "$scripts/python" -m pip install --quiet --find-links pypi "pytest-rulebearing==$VERSION"
          out="$("$scripts/rulebearing" --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"
          project="$RUNNER_TEMP/pytest-check"
          cp -R adapters/fixture "$project"
          printf '[pytest]\nrulebearing = true\n' > "$project/pytest.ini"
          cd "$project"
          status=0
          "$scripts/python" -m pytest -q -p no:cacheprovider > pytest.out 2>&1 || status=$?
          cat pytest.out
          test "$status" -eq 1
          grep -q "3 failed, 2 passed" pytest.out
          grep -q "is vacuous: its from side matched nothing" pytest.out

  pypi-publish:
    name: PyPI publish
    needs: [pypi-build, pypi-install-check, release]
    # Only a real tag publishes: not a manual run, not an -rc tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # twine with the PYPI_TOKEN repository secret, an API token scoped to the two projects; no
    # OIDC token is requested, so this job keeps the workflow's contents: read (docs/adr/0025).
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-packages
          path: pypi
      - run: python -m pip install --quiet twine==7.0.0
      # The rulebearing wheels first, so pytest-rulebearing never pins a version PyPI lacks.
      # --skip-existing lets a rerun after a partial upload finish the release.
      - name: publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload --non-interactive --skip-existing pypi/rulebearing-*.whl
          python -m twine upload --non-interactive --skip-existing pypi/pytest_rulebearing-*.whl

  # NuGet (plan 0002, Step 14): wrappers/nuget/pack.sh turns the six release archives into the
  # `Rulebearing` dotnet tool (the binaries under runtimes/<rid>/native/ and the launcher) and any
  # other package it owns, at the release version. Its contract is in docs/release.md.
  nuget-pack:
    name: NuGet packages
    needs: [binaries, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rulebearing-*
          path: dist
          merge-multiple: true
      - name: pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ ! -x wrappers/nuget/pack.sh ]; then
            echo "::error::wrappers/nuget/pack.sh is missing; it is the NuGet packing entry point docs/release.md names"
            exit 1
          fi
          wrappers/nuget/pack.sh dist "$VERSION" nuget
          if [ ! -f "nuget/Rulebearing.$VERSION.nupkg" ]; then
            echo "::error::pack.sh did not write nuget/Rulebearing.$VERSION.nupkg"
            exit 1
          fi
          ls -l nuget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: nuget/*.nupkg
          if-no-files-found: error

  # The smoke job of plan 0002 Step 14 for NuGet: install the tool from the built package into a
  # tool path on each host and run it.
  nuget-install-check:
    name: dotnet tool install Rulebearing (${{ matrix.os }})
    needs: [nuget-pack, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nuget
      - name: install and run
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools="$RUNNER_TEMP/tools"
          dotnet tool install Rulebearing --version "$VERSION" --tool-path "$tools" --add-source "$PWD/nuget"
          out="$("$tools/rulebearing" --version | tr -d '\r')"
          echo "$out"
          test "$out" = "rulebearing $VERSION"

  nuget-publish:
    name: NuGet publish
    needs: [nuget-pack, nuget-install-check, release]
    # Only a real tag publishes: not a manual run, not an -rc tag (the same rule as `release`).
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # dotnet nuget push with the NUGET_API_KEY repository secret, scoped to the Rulebearing package
    # prefix; no OIDC token is requested, so this job keeps contents: read (docs/adr/0025).
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: nuget
      # --skip-duplicate lets a rerun after a partial push finish the release.
      - name: publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for package in nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
