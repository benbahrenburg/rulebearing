# The synthetic benchmark for NFR-PERF-01 (docs/prd.md#nfr-perf-01): testbeds/synth/bench.sh on the
# standard Linux runner, the machine the design's 2-second target is set for. The figure goes to the
# job summary and an artefact; docs/perf.md records it by hand, so this workflow needs no write
# permission (docs/adr/0025-ci-and-supply-chain-hardening.md).
# Plan: docs/plans/pending/0001-wave-1-typescript-parity.md, Step 20.
# It then runs testbeds/synth/guard.sh on the same tree for NFR-PERF-03 (docs/prd.md#nfr-perf-03):
# plan docs/plans/pending/0003-wave-3-operations-surface-inner-loop.md, Step 16.
name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  synthetic:
    name: synthetic 5,500 modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: hyperfine
      - run: cargo build --release --locked -p rb-cli
      - run: testbeds/synth/bench.sh "$RUNNER_TEMP/synth" | tee "$RUNNER_TEMP/bench.txt"
      - run: |
          {
            echo "### Synthetic benchmark"
            echo
            echo "Runner: $(nproc) cores, $(uname -sm). Commit: $GITHUB_SHA."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: |
            ${{ runner.temp }}/bench.txt
            ${{ runner.temp }}/synth/hyperfine.json
      # The guard's check of one saved file on the same tree (NFR-PERF-03), after the benchmark and
      # never beside it (docs/adr/0059-gates-run-by-tier-and-mutants-by-diff.md). On this runner a
      # save that leaves the graph as it was must stay under 100 ms; one that changes it must stay
      # under the ceiling, the last recorded figure plus 20%: 270 ms in run 37018546157, so 324.
      # The ceiling is lowered when the figure falls and never raised
      # (docs/adr/0060-the-guards-latency-target-is-set-for-a-developer-machine.md).
      - name: guard latency
        env:
          RB_GUARD_CHANGED_THRESHOLD_MS: "324"
        run: |
          set -o pipefail
          testbeds/synth/guard.sh "$RUNNER_TEMP/synth-guard" | tee "$RUNNER_TEMP/guard.txt"
      - if: always()
        run: |
          {
            echo "### Guard latency"
            echo
            echo '```text'
            grep "^guard" "$RUNNER_TEMP/guard.txt" || echo "no figure"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
