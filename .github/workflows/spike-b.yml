# Spike B: the share of the .NET oracle repositories' types the Rust metadata reader attributes to a
# source file, measured weekly through the three-week window ADR-0003 sets (plan 0000, weeks 2 to 4).
# The pooled line is printed in the job summary and every repository's JSON is uploaded; the plan's
# 0D status table links the run for each week's figure.
# Plan: docs/plans/implemented/0000-wave-0-spike.md, Step 9. Decision: docs/adr/0003-dotnet-extractor-fallback.md.
# Actions pinned by SHA (docs/adr/0025-ci-and-supply-chain-hardening.md).
name: spike-b

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-b
  cancel-in-progress: false

jobs:
  attribution:
    name: attribution over the .NET oracles
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: python3 -m pip install --quiet pyyaml
      - name: measure
        run: |
          conformance/archunitnet/scripts/spike-b-attribution.sh | tee spike-b.log
          grep '^spike-b: repos=' spike-b.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-b-attribution
          path: |
            conformance/archunitnet/attribution
            spike-b.log
