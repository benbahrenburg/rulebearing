# Nightly proof over the open-source test beds
# (docs/artifacts/design.md#test-beds-open-source-repositories-to-validate-against).
# Each row of testbeds/manifest.yaml is cloned at its pinned SHA, its incumbent tool runs with the
# repository's own configuration, and the output, wall-clock time and peak memory are kept.
# Plan: docs/plans/pending/0000-wave-0-spike.md, Step 7. Requirement: docs/prd.md#nfr-conf-03.
#
# A row that fails to clone, build or run is reported as `error` and never fails the run
# (§ 1.7, Reliability); only a Rulebearing timing regression over 20% fails it, and that cannot
# fire until wave 1 records a Rulebearing timing. The summary is published to the
# `testbeds-results` branch, because `main` accepts changes only through reviewed pull requests;
# README.md carries the table between its testbeds markers, refreshed from that branch.
# Every action is pinned to a commit SHA (docs/adr/0025-ci-and-supply-chain-hardening.md).
name: nightly-testbeds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-testbeds
  cancel-in-progress: false

jobs:
  plan:
    name: rows to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet pyyaml
      # Rows with an incumbent tool get a runner each; the rest are recorded by the summary job.
      - id: rows
        run: |
          rows="$(python3 -c 'import json, yaml; print(json.dumps([r["repo"] for r in yaml.safe_load(open("testbeds/manifest.yaml"))["rows"] if r["tool"] != "none"]))')"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.repo }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.rows) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The .NET oracles span these SDKs (plan 0000 § 1.8).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: python3 -m pip install --quiet pyyaml
      - id: slug
        env:
          REPO: ${{ matrix.repo }}
        run: echo "slug=${REPO//\//__}" >> "$GITHUB_OUTPUT"
      - env:
          REPO: ${{ matrix.repo }}
        run: testbeds/run.sh "$REPO" testbeds/out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbed-${{ steps.slug.outputs.slug }}
          path: testbeds/out
          if-no-files-found: error

  summary:
    name: summary and regression check
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: python3 -m pip install --quiet pyyaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: testbed-*
          path: testbeds/out
          merge-multiple: true
      - name: record the rows with no incumbent
        run: |
          python3 -c 'import yaml; print("\n".join(r["repo"] for r in yaml.safe_load(open("testbeds/manifest.yaml"))["rows"] if r["tool"] == "none"))' |
            while IFS= read -r repo; do testbeds/run.sh "$repo" testbeds/out; done
      - run: node testbeds/summarise.mjs testbeds/out
      - run: cat testbeds/out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: previous summary
        run: git show origin/testbeds-results:summary.json > previous-summary.json 2>/dev/null || rm -f previous-summary.json
      - run: testbeds/check-regression.sh previous-summary.json testbeds/out/summary.json 20
      - name: publish to the testbeds-results branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach ../results
          cd ../results
          git checkout --orphan testbeds-results-next
          git rm -rq --cached . && git clean -fdxq
          cp "$GITHUB_WORKSPACE/testbeds/out/summary.md" "$GITHUB_WORKSPACE/testbeds/out/summary.json" .
          for dir in "$GITHUB_WORKSPACE"/testbeds/out/*/; do
            name="$(basename "$dir")"
            mkdir -p "rows/$name"
            cp "$dir"/result.json "rows/$name/" 2>/dev/null || true
            cp "$dir"/timing.json "rows/$name/" 2>/dev/null || true
          done
          git add -A
          git commit -qm "Test beds, nightly run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push --force origin HEAD:testbeds-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbeds-summary
          path: |
            testbeds/out/summary.md
            testbeds/out/summary.json
