# Dependency updates. Pinned GitHub Actions are bumped here, by SHA, never by editing a tag
# (docs/adr/0025-ci-and-supply-chain-hardening.md). Conformance pins are deliberate and are
# excluded: the upstream version is the specification (docs/adr/0009-conformance-suites-as-specification.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # The oxc crates and the ruff crates each release in lockstep and are pinned to one exact
      # version, so a bump of one alone puts two versions in the graph and fails to compile. A
      # 0.x minor is a major to Dependabot, so these groups take every update type. A dependency
      # joins the first group that matches it; these come before the minor-and-patch group.
      # oxc_resolver is versioned on its own line.
      oxc:
        patterns: ["oxc_*"]
        exclude-patterns: ["oxc_resolver"]
      ruff:
        patterns: ["ruff_*"]
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      linters:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*", "typescript"]
    # typescript-eslint 8.70 accepts typescript <6.1, so a TypeScript major breaks npm ci for the
    # whole group. Remove this when a typescript-eslint release supports TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The packages declare engines node >=22 and CI runs Node 22; the types follow the runtime.
      # Move this with the Node version in the workflows.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
