# Proper nouns that clippy's `doc_markdown` lint would otherwise ask to be written as code.
# ".." keeps clippy's built-in list (TypeScript, JavaScript, GitHub and the rest).
# Adding a name here is not an `allow`: the lint still catches every real identifier.
doc-valid-idents = [
    "..",
    "ArchUnitNET",
    "CommonJS",
    "CodeView",
    "CoffeeScript",
    "JSDoc",
    "LiveScript",
    "MSBuild",
    "NetArchTest",
    "NuGet",
    "PnP",
    "QuickJS",
]
