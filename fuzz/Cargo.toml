# cargo-fuzz targets for the parsers that read untrusted bytes.
# A workspace of its own, so the main workspace never needs a nightly toolchain or libFuzzer.
# Run: cargo +nightly fuzz run metadata_reader -- -max_total_time=600   (from this folder)
# Plan: docs/plans/pending/0000-wave-0-spike.md, Step 9; requirement docs/prd.md#nfr-sec-01.
[package]
name = "rb-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rb-extract-dotnet = { path = "../crates/rb-extract-dotnet" }

[[bin]]
name = "metadata_reader"
path = "fuzz_targets/metadata_reader.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
