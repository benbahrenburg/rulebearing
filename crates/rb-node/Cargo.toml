[package]
name = "rb-node"
description = "Rulebearing Node binding (napi-rs) exposing cruise() and format()"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The addon Node loads. The N-API symbols exist only inside a Node process, so no Rust test binary
# can link against them: the crate is tested from JavaScript (`__tests__/`, vitest), and its
# coverage measured there (scripts/coverage-per-crate.sh). Its behaviour is `rb_cli::api`'s, which
# has its own Rust tests.
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
rb-cli = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# The workspace's lints, but `unsafe_code` at `deny` rather than `forbid`: `#[napi]` expands to
# `unsafe` N-API glue under its own `#[allow(unsafe_code)]`, which `forbid` refuses. Hand-written
# `unsafe` is still an error here. No other crate opts out (plan 0003, § 1.6; CLAUDE.md, Rust
# conventions). Keep the rest in step with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
