[package]
name = "rb-wasm"
description = "Rulebearing's playground facade: the library crates compiled to wasm32, strings in and out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# A facade outside the dependency direction: no crate depends on it (ADR-0010). `cdylib` is the
# wasm module the page loads; `rlib` lets the native tests reach the same functions.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rb-model = { workspace = true }
rb-config = { workspace = true }
rb-rules = { workspace = true }
rb-report = { workspace = true }
rb-ingest = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[lints]
workspace = true
