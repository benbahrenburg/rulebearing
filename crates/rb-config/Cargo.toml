[package]
name = "rb-config"
description = "Rulebearing configuration: native and dependency-cruiser formats into one model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["js-config"]
# QuickJS: evaluates JavaScript configurations and runs `plugin:` reporters.
js-config = ["dep:rquickjs"]

[dependencies]
rb-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
# The JavaScript configuration sandbox (ADR-0006), behind `js-config` (default on): QuickJS
# does not link for wasm32-unknown-unknown, so the playground builds without it (plan 0004, Step 2).
rquickjs = { workspace = true, optional = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
