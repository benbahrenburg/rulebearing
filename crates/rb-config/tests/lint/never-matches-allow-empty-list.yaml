allowEmpty: [plugins-stay-apart]
rules:
  dependencies:
    forbidden:
      - name: plugins-stay-apart
        comment: "Matches nothing until the first plugin lands. plan:0005-guard-catalogue"
        fix: "Talk to another plugin through the host API."
        severity: error
        from: { path: "^nowhere/" }
        to: { path: "^nowhere-either/" }
