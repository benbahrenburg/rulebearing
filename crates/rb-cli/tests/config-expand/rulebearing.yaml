# The input of crates/rb-cli/tests/config_expand.rs: presets composed for one language, a define,
# and both shorthands. `config expand` must print every rule the shorthands stand for.
extends: [rulebearing:python, rulebearing:recommended]
defines:
  legacy: { fromJson: legacy.json, select: "[*].name", joinWith: "|" }
languages:
  python:
    roots: [src]
rules:
  dependencies:
    forbidden:
      - name: no-legacy-imports
        comment: "The legacy packages are frozen. adr:0003"
        fix: "Import the replacement under src/app/ instead."
        severity: error
        from: { path: "^src/app/" }
        to: { path: "^src/(${legacy})/" }
  layers:
    - name: clean
      layers: ["^src/web/", "^src/application/", "^src/domain/"]
  independence:
    - name: features
      pattern: "^src/features/([^/]+)/"
