# Imported from setup.cfg by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: ["."]
# ignore_imports: `rulebearing baseline --baseline-mode shrink-only` fails when an entry no longer occurs, which is import-linter's unmatched-ignore alerting.
# An entry excuses the import from its importer to its imported module. For a rule that follows chains (reachable), dependency-cruiser keys a violation by importer and rule, so the entry excuses that importer's chains to the rule's modules; a chain through the ignored import from another module is still reported.
options:
  knownViolations:
    - type: reachability
      from: pkg/features/cart/view.py
      to: pkg/features/search/__init__.py
      rule:
        name: features:pkg.features.cart-to-pkg.features.search
        severity: error
      reason: ignore_imports
rules:
  dependencies:
    forbidden:
      # import-linter contract `features` (independence): Features are independent
      #   ignore_imports = pkg.features.cart.view -> pkg.features.search
      #   modules = pkg.features.cart, pkg.features.search, pkg.features.profile
      - name: features:pkg.features.cart-to-pkg.features.search
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/cart(/|\\.py$)"
        to:
          path: "^pkg/features/search(/|\\.py$)"
          reachable: true
      - name: features:pkg.features.cart-to-pkg.features.profile
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/cart(/|\\.py$)"
        to:
          path: "^pkg/features/profile(/|\\.py$)"
          reachable: true
      - name: features:pkg.features.search-to-pkg.features.cart
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/search(/|\\.py$)"
        to:
          path: "^pkg/features/cart(/|\\.py$)"
          reachable: true
      - name: features:pkg.features.search-to-pkg.features.profile
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/search(/|\\.py$)"
        to:
          path: "^pkg/features/profile(/|\\.py$)"
          reachable: true
      - name: features:pkg.features.profile-to-pkg.features.cart
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/profile(/|\\.py$)"
        to:
          path: "^pkg/features/cart(/|\\.py$)"
          reachable: true
      - name: features:pkg.features.profile-to-pkg.features.search
        comment: "import-linter contract: Features are independent"
        severity: error
        from:
          path: "^pkg/features/profile(/|\\.py$)"
        to:
          path: "^pkg/features/search(/|\\.py$)"
          reachable: true
  independence:
    # import-linter contract `features-direct` (independence): Every feature, direct imports only
    #   allow_indirect_imports = True
    #   modules = pkg.features.*
    - name: features-direct
      comment: "import-linter contract: Every feature, direct imports only"
      severity: error
      pattern: "^(pkg/features/[^/]+)(?:/|\\.py$)"
