# Imported from .importlinter by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: [src]
# ignore_imports: `rulebearing baseline --baseline-mode shrink-only` fails when an entry no longer occurs, which is import-linter's unmatched-ignore alerting.
# An entry excuses the import from its importer to its imported module. For a rule that follows chains (reachable), dependency-cruiser keys a violation by importer and rule, so the entry excuses that importer's chains to the rule's modules; a chain through the ignored import from another module is still reported.
# `no-payments`: `shop.orders.* -> shop.nowhere` names no module file under the repository, so it has no entry
options:
  knownViolations:
    - type: reachability
      from: src/shop/orders/checkout.py
      to: src/shop/payments/gateway.py
      rule:
        name: no-payments
        severity: error
      reason: ignore_imports
rules:
  dependencies:
    forbidden:
      # import-linter contract `no-payments` (forbidden): Orders do not reach payments
      #   forbidden_modules = shop.payments, requests
      #   ignore_imports = shop.orders.checkout -> shop.payments.gateway, shop.orders.* -> shop.nowhere
      #   source_modules = shop.orders
      - name: no-payments
        comment: "import-linter contract: Orders do not reach payments"
        severity: error
        from:
          path: "^src/shop/orders(/|\\.py$)"
        to:
          path: ["^src/shop/payments(/|\\.py$)", "^requests(\\.|$)"]
          reachable: true
      # import-linter contract `models-direct` (forbidden): No module imports another package's models directly
      #   allow_indirect_imports = true
      #   as_packages = False
      #   forbidden_modules = shop.**.models
      #   source_modules = shop.*.views
      - name: models-direct
        comment: "import-linter contract: No module imports another package's models directly"
        severity: error
        from:
          path: "^src/shop/[^/]+/views(/__init__\\.py|\\.py)$"
        to:
          path: "^src/shop/[^/]+(?:/[^/]+)*/models(/__init__\\.py|\\.py)$"
