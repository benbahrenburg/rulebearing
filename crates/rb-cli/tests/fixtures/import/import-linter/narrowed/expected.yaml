# Imported from pyproject.toml by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
# ignore_imports: each rule's `graph.ignore` removes those imports from the graph the rule sees, chains included; an entry that matches no import makes the rule vacuous, which is import-linter's unmatched-ignore alerting.
# import-linter does not read app/ns, folders without `__init__.py` below a root package: each rule's `graph.modulesNot` leaves them out as the tree stood when imported, so run the import again when one gains an `__init__.py`.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: ["."]
rules:
  dependencies:
    forbidden:
      # import-linter contract `layered` (layers): Low does not reach high
      #   ignore_imports = app.mid.b -> app.high.c
      #   layers = app.high, app.low
      - name: layered:app.low-to-app.high
        comment: "import-linter contract: Low does not reach high"
        severity: error
        from:
          path: "^app/low(/.*)?\\.py$"
        to:
          path: "^app/high(/.*)?\\.py$"
          reachable: true
        graph:
          ignore:
            - from: "^app/mid/b(/__init__\\.py|\\.py)$"
              to: "^app/high/c(/__init__\\.py|\\.py)$"
          dependencyTypesNot: [type-only]
          modulesNot: "^app/ns(/|$)"
          chainsThrough: "^app(/.*)?\\.py$"
    allowed:
      # import-linter contract `guarded` (protected): Only mid imports high
      #   allowed_importers = app.mid
      #   ignore_imports = app.low.h -> app.high.c
      #   protected_modules = app.high
      - name: guarded
        comment: "import-linter contract: Only mid imports high"
        from:
          path: ["^app/mid(/.*)?\\.py$", "^app/high(/.*)?\\.py$"]
        to:
          path: "^app/high(/.*)?\\.py$"
        allowEmpty: true
      - name: guarded:ignore-imports-1
        comment: "import-linter contract: Only mid imports high"
        from:
          path: "^app/low/h(/__init__\\.py|\\.py)$"
        to:
          path: "^app/high/c(/__init__\\.py|\\.py)$"
        allowEmpty: true
      - name: guarded:outside-the-root-packages
        comment: "import-linter contract: Only mid imports high"
        from:
          pathNot: "^app(/.*)?\\.py$"
        to:
          path: "^app/high(/.*)?\\.py$"
        allowEmpty: true
      - name: guarded:not-walked
        comment: "import-linter contract: Only mid imports high"
        from:
          path: "^app/ns(/|$)"
        to:
          path: "^app/high(/.*)?\\.py$"
        allowEmpty: true
      - name: guarded:type-checking
        comment: "import-linter contract: Only mid imports high"
        from: {}
        to:
          path: "^app/high(/.*)?\\.py$"
          dependencyTypes: [type-only]
        allowEmpty: true
      # dependency-cruiser's allowed rules are one allow-list: this one allows every import of a module no protected contract names.
      - name: import-linter:unprotected
        comment: "import-linter: every import of an unprotected module"
        from: {}
        to:
          pathNot: "^app/high(/.*)?\\.py$"
        allowEmpty: true
    allowedSeverity: error
