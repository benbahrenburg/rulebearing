# The import-linter filters ADR-0038 writes as `graph`: ignore_imports, TYPE_CHECKING imports,
# a folder without __init__.py (app/ns) and a module outside the root package (tools/).
[tool.importlinter]
root_packages = ["app"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layered"
name = "Low does not reach high"
type = "layers"
layers = ["app.high", "app.low"]
ignore_imports = ["app.mid.b -> app.high.c"]

[[tool.importlinter.contracts]]
id = "guarded"
name = "Only mid imports high"
type = "protected"
protected_modules = ["app.high"]
allowed_importers = ["app.mid"]
ignore_imports = ["app.low.h -> app.high.c"]
