# Imported from .importlinter by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
# ignore_imports: each rule's `graph.ignore` removes those imports from the graph the rule sees, chains included; an entry that matches no import makes the rule vacuous, which is import-linter's unmatched-ignore alerting.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: [src]
rules:
  slices:
    # import-linter contract `siblings` (acyclic_siblings): Siblings are acyclic
    #   ancestors = core
    #   ignore_imports = core.a -> core.b
    # ignore_imports: each slice rule allows an empty slicing, so an entry that matches no import is not reported as import-linter's unmatched-ignore alerting would
    - name: siblings:core
      comment: "import-linter contract: Siblings are acyclic"
      severity: error
      matching: "core.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
      graph:
        ignore:
          - from: "^src/core/a(/__init__\\.py|\\.py)$"
            to: "^src/core/b(/__init__\\.py|\\.py)$"
    - name: siblings:core.a
      comment: "import-linter contract: Siblings are acyclic"
      severity: error
      matching: "core.a.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
      graph:
        ignore:
          - from: "^src/core/a(/__init__\\.py|\\.py)$"
            to: "^src/core/b(/__init__\\.py|\\.py)$"
    - name: siblings:core.a.deep
      comment: "import-linter contract: Siblings are acyclic"
      severity: error
      matching: "core.a.deep.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
      graph:
        ignore:
          - from: "^src/core/a(/__init__\\.py|\\.py)$"
            to: "^src/core/b(/__init__\\.py|\\.py)$"
    - name: siblings:core.b
      comment: "import-linter contract: Siblings are acyclic"
      severity: error
      matching: "core.b.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
      graph:
        ignore:
          - from: "^src/core/a(/__init__\\.py|\\.py)$"
            to: "^src/core/b(/__init__\\.py|\\.py)$"
    # import-linter contract `top` (acyclic_siblings): Only the top is sliced
    #   ancestors = core, core.missing
    #   skip_descendants = true
    # the package `core.missing` was not found under the repository, so only it is sliced, not the packages below it
    - name: top:core
      comment: "import-linter contract: Only the top is sliced"
      severity: error
      matching: "core.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
    - name: top:core.missing
      comment: "import-linter contract: Only the top is sliced"
      severity: error
      matching: "core.missing.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
