        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/domain(/|\\.py$)"
        to:
          path: "^src/importlinter/ui(/|\\.py$)"
          reachable: true
      - name: layers:domain-to-api
        comment: "import-linter contract: Layered architecture"
        severity: error
