# Imported from .importlinter by `rulebearing import import-linter`.
# Each rule's comment names its import-linter contract; the contract's options are written above its first rule.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
languages:
  python:
    roots: [src]
rules:
  dependencies:
    forbidden:
      # import-linter contract `layers` (layers): Layered architecture
      #   containers = importlinter
      #   exhaustive = true
      #   layers = cli, ui, api, contracts, configuration, adapters, application, domain
      # exhaustive: every module directly under `importlinter` is a layer (checked when imported; no rule checks it on later runs)
      - name: layers:ui-to-cli
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/ui(/|\\.py$)"
        to:
          path: "^src/importlinter/cli(/|\\.py$)"
          reachable: true
      - name: layers:api-to-cli
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/api(/|\\.py$)"
        to:
          path: "^src/importlinter/cli(/|\\.py$)"
          reachable: true
      - name: layers:api-to-ui
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/api(/|\\.py$)"
        to:
          path: "^src/importlinter/ui(/|\\.py$)"
          reachable: true
      - name: layers:contracts-to-cli
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/contracts(/|\\.py$)"
        to:
          path: "^src/importlinter/cli(/|\\.py$)"
          reachable: true
      - name: layers:contracts-to-ui
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/contracts(/|\\.py$)"
        to:
          path: "^src/importlinter/ui(/|\\.py$)"
          reachable: true
      - name: layers:contracts-to-api
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/contracts(/|\\.py$)"
        to:
          path: "^src/importlinter/api(/|\\.py$)"
          reachable: true
      - name: layers:configuration-to-cli
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/configuration(/|\\.py$)"
        to:
          path: "^src/importlinter/cli(/|\\.py$)"
          reachable: true
