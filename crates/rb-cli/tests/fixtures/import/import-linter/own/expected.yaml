        severity: error
        from:
          path: "^src/importlinter/domain(/|\\.py$)"
        to:
          path: "^src/importlinter/adapters(/|\\.py$)"
          reachable: true
      - name: layers:domain-to-application
        comment: "import-linter contract: Layered architecture"
        severity: error
        from:
          path: "^src/importlinter/domain(/|\\.py$)"
        to:
          path: "^src/importlinter/application(/|\\.py$)"
          reachable: true
  slices:
    # import-linter contract `acyclic` (acyclic_siblings): All packages are acyclic
    #   ancestors = importlinter
    - name: acyclic:importlinter
      comment: "import-linter contract: All packages are acyclic"
      severity: error
      matching: "importlinter.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
    - name: acyclic:importlinter.adapters
      comment: "import-linter contract: All packages are acyclic"
      severity: error
      matching: "importlinter.adapters.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
    - name: acyclic:importlinter.application
      comment: "import-linter contract: All packages are acyclic"
      severity: error
      matching: "importlinter.application.(*)"
      segments: 1
      should: beFreeOfCycles
      allowEmpty: true
    - name: acyclic:importlinter.application.ports
      comment: "import-linter contract: All packages are acyclic"
      severity: error
      matching: "importlinter.application.ports.(*)"
      segments: 1
      should: beFreeOfCycles
