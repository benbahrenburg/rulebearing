# Each rule is preceded by the C# chain it came from; a chain that cannot be translated is kept, commented out, with the reason.
# 7 rule chains read: 3 imported, 4 commented out.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
rules:
  elements:
    # Types.InAssembly(CoreAssembly).That().ResideInNamespace("Shop.Core.Domain")
    #   .ShouldNot().HaveDependencyOnAny("Shop.Infrastructure", "System.Data")
    #   .GetResult()   [DomainTests.cs:16]
    - name: domain-should-not-depend-on-infrastructure
      comment: "imported from tests/Shop.ArchitectureTests/DomainTests.cs:16"
      select:
        kind: type
        where:
          all:
            - resideInAssembly: Shop.Core
            - haveFullNameStartingWith: Shop.Core.Domain
      should:
        not:
          dependOnAny:
            kind: type
            where:
              haveFullNameMatching: "^(?:Shop\\.Infrastructure|System\\.Data)(?:$|[.+])"
    # Types.InAssembly(Assembly.GetAssembly(typeof(AggregateRoot))).That().Inherit(typeof(AggregateRoot)).Or().HaveNameEndingWith("Root", StringComparison.Ordinal)
    #   .Should().BeSealed().Or().BeAbstract()
    #   .GetResult()   [DomainTests.cs:27]
    - name: aggregates-are-named-and-abstract-or-sealed
      comment: "imported from tests/Shop.ArchitectureTests/DomainTests.cs:27"
      select:
        kind: type
        where:
          all:
            - resideInAssembly: Shop.Core
            - any:
                - all:
                    - areAssignableTo: [Shop.Core.Domain.AggregateRoot]
                    - areNot: [Shop.Core.Domain.AggregateRoot]
                - haveNameEndingWith: Root
      should:
        any:
          - beSealed: true
          - beAbstract: true
    # Types.InCurrentDomain().That().HaveNameMatching("Repository$").And().DoNotResideInNamespaceContaining("Tests")
    #   .Should().BeInterfaces()
    #   .GetResult()   [DomainTests.cs:38]
    - name: repositories-are-interfaces
      comment: "imported from tests/Shop.ArchitectureTests/DomainTests.cs:38"
      select:
        kind: type
        where:
          all:
            - haveNameMatching: "[Rr][Ee][Pp][Oo][Ss][Ii][Tt][Oo][Rr][Yy]$"
            - not:
                any:
                  - all:
                      - areNotNested: true
                      - resideInNamespaceMatching: "^.*[Tt][Ee][Ss][Tt][Ss].*$"
                  - all:
                      - areNested: true
                      - any:
                          - arePublic: true
                          - arePrivate: true
                      - areNestedIn:
                          kind: type
                          where:
                            haveFullNameMatching: "^.*[Tt][Ee][Ss][Tt][Ss].*$"
      should:
        be:
          kind: interface
