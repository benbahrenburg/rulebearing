# Imported from package.json by `rulebearing import eslint`.
# Each rule is preceded by the ESLint setting it came from. Package imports in the configuration were not run, so rules from shareable configurations are not here.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
rules:
  dependencies:
    forbidden:
      # import/no-restricted-paths (config), zones[0]: {"target":"./packages/a","from":"./packages/b"}
      - name: no-restricted-paths:1
        comment: "imported from package.json: import/no-restricted-paths zones[0]"
        severity: error
        from:
          path: "^packages/a(/|$)"
        to:
          path: "^packages/b(/|$)"
      # boundaries/element-types (config): {"default":"allow","rules":[{"from":"b","disallow":"a"}]}
      # eslint-plugin-boundaries gives a file to the first element whose pattern matches; the patterns below do not encode that order
      # not imported: `basePattern` narrows where the pattern applies, which the importer does not translate
      # - name: boundaries:b
