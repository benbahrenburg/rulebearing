# Imported from .eslintrc.json by `rulebearing import eslint`.
# Each rule is preceded by the ESLint setting it came from. Package imports in the configuration were not run, so rules from shareable configurations are not here.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
rules:
  dependencies:
    forbidden:
      # boundaries/element-types (config): {"rules":[{"from":"ui","allow":["domain"]}]}
      # eslint-plugin-boundaries gives a file to the first element whose pattern matches; the patterns below do not encode that order
      # two `ui` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:ui-to-ui
        comment: "imported from .eslintrc.json: boundaries/element-types, element type `ui`"
        severity: error
        from:
          path: "(?:^|/)((?:src/ui))/"
        to:
          path: "(?:^|/)((?:src/ui))/"
          pathNot: "(?:^|/)$1/"
      # boundaries/elements: {"type":"domain","pattern":"src/domain"}
      - name: boundaries:domain
        comment: "imported from .eslintrc.json: boundaries/element-types, element type `domain`"
        severity: error
        from:
          path: "(?:^|/)((?:src/domain))/"
        to:
          path: "(?:^|/)((?:src/ui))/"
      # two `domain` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:domain-to-domain
        comment: "imported from .eslintrc.json: boundaries/element-types, element type `domain`"
        severity: error
        from:
          path: "(?:^|/)((?:src/domain))/"
        to:
          path: "(?:^|/)((?:src/domain))/"
          pathNot: "(?:^|/)$1/"
