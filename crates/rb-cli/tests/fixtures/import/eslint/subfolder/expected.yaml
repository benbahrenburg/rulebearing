# Imported from packages/app/.eslintrc.json by `rulebearing import eslint`.
# Each rule is preceded by the ESLint setting it came from. Package imports in the configuration were not run, so rules from shareable configurations are not here.
# ESLint turns a rule off later in the file: boundaries/element-types is off for files matching src/legacy/** (overrides[0]); the rules below still check those files.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
rules:
  dependencies:
    forbidden:
      # import/no-restricted-paths (config), zones[0]: {"target":"./src/server","from":"./src/client"}
      - name: no-restricted-paths:1
        comment: "imported from packages/app/.eslintrc.json: import/no-restricted-paths zones[0]"
        severity: error
        from:
          path: "^packages/app/src/server(/|$)"
        to:
          path: "^packages/app/src/client(/|$)"
      # boundaries/element-types (config): {"default":"allow","rules":[{"from":"feature","disallow":"feature"}]}
      # eslint-plugin-boundaries gives a file to the first element whose pattern matches; the patterns below do not encode that order
      # two `feature` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:feature-to-feature
        comment: "imported from packages/app/.eslintrc.json: boundaries/element-types, element type `feature`"
        severity: error
        from:
          path: "^packages/app/(?:.*/)?((?:features/[^/]*))/"
        to:
          path: "^packages/app/(?:.*/)?((?:features/[^/]*))/"
          pathNot: "^packages/app/(?:.*/)?$1/"
