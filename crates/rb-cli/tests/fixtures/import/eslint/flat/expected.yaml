# Imported from eslint.config.mjs by `rulebearing import eslint`.
# Each rule is preceded by the ESLint setting it came from. Package imports in the configuration were not run, so rules from shareable configurations are not here.
# Not imported (no forbidden-rule equivalent in this importer): boundaries/no-unknown (config[1])
# ESLint turns a rule off later in the file: import/no-restricted-paths is off for files matching **/*.test.ts (config[2]); the rules below still check those files.
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json
rules:
  dependencies:
    forbidden:
      # import/no-restricted-paths (config[1]), zones[0]: {"target":"./src/client","from":"./src/server","except":["./shared"],"message":"The client runs in the browser."}
      # ESLint applied this rule to files matching src/**/*.ts; the target above is what the rule checks
      - name: no-restricted-paths:1
        comment: "imported from eslint.config.mjs: import/no-restricted-paths zones[0] (The client runs in the browser.)"
        severity: error
        from:
          path: "^src/client(/|$)"
        to:
          path: "^src/server(/|$)"
          pathNot: "^src/server/shared(/|$)"
      # import/no-restricted-paths (config[1]), zones[1]: {"target":["./src/features","./src/shared"],"from":"./src/app"}
      # ESLint applied this rule to files matching src/**/*.ts; the target above is what the rule checks
      - name: no-restricted-paths:2
        comment: "imported from eslint.config.mjs: import/no-restricted-paths zones[1]"
        severity: error
        from:
          path: ["^src/features(/|$)", "^src/shared(/|$)"]
        to:
          path: "^src/app(/|$)"
      # import/no-restricted-paths (config[1]), zones[2]: {"target":"./src/**/*.ts","from":"./scripts/**"}
      # ESLint applied this rule to files matching src/**/*.ts; the target above is what the rule checks
      - name: no-restricted-paths:3
        comment: "imported from eslint.config.mjs: import/no-restricted-paths zones[2]"
        severity: error
        from:
          path: "^src/(?:.*/)?[^/]*\\.ts$"
        to:
          path: "^scripts/.*$"
      # boundaries/element-types (config[1]): {"default":"disallow","rules":[{"from":"app","allow":["feature","shared","helper"]},{"from":"feature","allow":["shared","helper"]},{"from":["shared","helper"],"allow":"helper"}]}
      # eslint-plugin-boundaries gives a file to the first element whose pattern matches; the patterns below do not encode that order
      # two `app` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:app-to-app
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `app`"
        severity: error
        from:
          path: "(?:^|/)((?:src/app/[^/]*))/"
        to:
          path: "(?:^|/)((?:src/app/[^/]*))/"
          pathNot: "(?:^|/)$1/"
      # boundaries/elements: {"type":"feature","pattern":"src/features/*"}
      - name: boundaries:feature
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `feature`"
        severity: error
        from:
          path: "(?:^|/)((?:src/features/[^/]*))/"
        to:
          path: "(?:^|/)((?:src/app/[^/]*))/"
      # two `feature` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:feature-to-feature
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `feature`"
        severity: error
        from:
          path: "(?:^|/)((?:src/features/[^/]*))/"
        to:
          path: "(?:^|/)((?:src/features/[^/]*))/"
          pathNot: "(?:^|/)$1/"
      # boundaries/elements: {"type":"shared","pattern":"src/shared/*"}
      - name: boundaries:shared
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `shared`"
        severity: error
        from:
          path: "(?:^|/)((?:src/shared/[^/]*))/"
        to:
          path: ["(?:^|/)((?:src/app/[^/]*))/", "(?:^|/)((?:src/features/[^/]*))/"]
      # two `shared` elements may not import each other; one importing itself is not checked, as in eslint-plugin-boundaries
      - name: boundaries:shared-to-shared
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `shared`"
        severity: error
        from:
          path: "(?:^|/)((?:src/shared/[^/]*))/"
        to:
          path: "(?:^|/)((?:src/shared/[^/]*))/"
          pathNot: "(?:^|/)$1/"
      # boundaries/elements: {"type":"helper","pattern":"src/helpers/*.ts","mode":"file"}
      - name: boundaries:helper
        comment: "imported from eslint.config.mjs: boundaries/element-types, element type `helper`"
        severity: error
        from:
          path: "(?:^|/)((?:src/helpers/[^/]*\\.ts))$"
        to:
          path:
            - "(?:^|/)((?:src/app/[^/]*))/"
            - "(?:^|/)((?:src/features/[^/]*))/"
            - "(?:^|/)((?:src/shared/[^/]*))/"
