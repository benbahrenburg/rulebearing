[package]
name = "rb-report"
description = "Rulebearing reporters: every dependency-cruiser reporter plus sarif, junit, trx, agent, plantuml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rb-model = { workspace = true }
rb-rules = { workspace = true }
serde = { workspace = true }
# `preserve_order`: the `dot` theme attributes print in the order the theme gives them
# (dependency-cruiser's object key order), so a theme renders byte for byte as upstream.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
