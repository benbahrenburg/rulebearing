[package]
name = "rb-extract-dotnet"
description = "Rulebearing .NET extractor: ECMA-335 metadata, IL operands and portable PDBs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rb-model = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Project and solution files (MIT OR Apache-2.0); embedded portable PDBs are deflate-compressed
# (miniz_oxide: MIT OR Zlib OR Apache-2.0). Plan 0000, Step 9; docs/adr/0019-mit-licence.md.
roxmltree = { workspace = true }
miniz_oxide = { workspace = true }
# excludeProjects patterns and the assemblies / directories loader globs (plan 0002, Step 1).
regex = { workspace = true }
globset = { workspace = true }
sha1 = { workspace = true }
# `--mode source` (plan 0003, Step 14): the .cs files parsed with tree-sitter-c-sharp (both MIT,
# pinned in the workspace), in parallel with rayon (MIT OR Apache-2.0), each file's parse kept
# for the next incremental run as JSON.
tree-sitter = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Source mode reads C# without a build; on in the binary through rb-cli's `source-mode` feature.
source-mode = ["dep:tree-sitter", "dep:tree-sitter-c-sharp", "dep:rayon", "dep:serde_json"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[test]]
name = "source_mode"
required-features = ["source-mode"]
