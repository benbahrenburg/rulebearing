# Rulebearing's own architecture rules, enforced by the `self-check` job in .github/workflows/ci.yml
# (docs/plans/pending/0001-wave-1-typescript-parity.md, Step 9). Every rule cites the ADR it serves,
# and the job runs with --require-comment-token, as ADR-0001 asks of every user.
# Rust is not one of the three supported languages, so the rules are evaluated over the crate graph
# scripts/cargo-graph.sh builds from `cargo metadata`: one module per crate, named by its manifest
# (crates/<name>/Cargo.toml), one edge per normal dependency on a workspace crate.
#   scripts/cargo-graph.sh > target/cargo-graph.json
#   rulebearing cruise --config rulebearing.yaml --require-comment-token --graph target/cargo-graph.json -T err
$schema: https://benbahrenburg.github.io/rulebearing/schema/config-v1.json

rules:
  dependencies:
    forbidden:
      - name: model-depends-on-nothing
        comment: "rb-model is the contract every crate reads; it depends on nothing in the workspace. adr:0010"
        fix: "Move the type into rb-model, or move the logic that needs the other crate out of rb-model."
        severity: error
        from: { path: "^crates/rb-model/" }
        to: { path: "^crates/rb-", pathNot: "^crates/rb-model/" }
        examples:
          forbidden: ["crates/rb-model/Cargo.toml -> crates/rb-config/Cargo.toml"]
          allowed: ["crates/rb-config/Cargo.toml -> crates/rb-model/Cargo.toml"]
      - name: extractors-only-read-the-model
        comment: "An extractor's only output is the graph document; it may not know about rules or config. adr:0010"
        fix: "Pass per-language options as a plain struct defined in rb-model instead of reading rb-config."
        severity: error
        from: { path: "^crates/rb-extract-(ts|dotnet|python)/" }
        to: { path: "^crates/rb-(config|rules|report|cli|ingest|node)/" }
        examples:
          forbidden: ["crates/rb-extract-ts/Cargo.toml -> crates/rb-config/Cargo.toml"]
          allowed: ["crates/rb-extract-ts/Cargo.toml -> crates/rb-model/Cargo.toml"]
      - name: engine-is-language-agnostic
        comment: "rb-rules and rb-report compare strings in the document; they never import an extractor. adr:0010 adr:0014"
        fix: "Put the language-specific fact into the graph document at extraction time and match on it as a string."
        severity: error
        from: { path: "^crates/rb-(rules|report)/" }
        to: { path: "^crates/rb-extract-" }
        examples:
          forbidden: ["crates/rb-rules/Cargo.toml -> crates/rb-extract-ts/Cargo.toml"]
          allowed: ["crates/rb-report/Cargo.toml -> crates/rb-rules/Cargo.toml"]
      - name: no-circular-crates
        comment: "The crate graph is a DAG. adr:0010"
        fix: "Move the shared type down into the crate both sides already depend on, usually rb-model."
        severity: error
        from: { path: "^crates/" }
        to: { circular: true }
    required:
      - name: cli-links-every-extractor-behind-a-feature
        comment: "Each extractor is a Cargo feature of rb-cli so a narrower build never links the others. adr:0010"
        fix: "Add the extractor to rb-cli's dependencies as an optional dependency behind its extract-<language> feature."
        module: { path: "^crates/rb-cli/Cargo\\.toml$" }
        to: { path: "^crates/rb-extract-(ts|dotnet|python)/", reachable: true }
