            - "(^|/)(Program|Startup|AssemblyInfo)\\.cs$"
            - "(^|/)Migrations/"
            - "(^|/)__main__\\.py$"
            - "(^|/)conftest\\.py$"
            - "(^|/)(src/)?(main|index|cli|server|app)\\.[cm]?[jt]sx?$"
            - "(^|/)(scripts|tools|bin)/"
      - name: analytics-not-to-its-dependents
        comment: "pgroonga, tools import analytics, so it sits below them: analytics importing one of them back would make a cycle between top-level packages."
