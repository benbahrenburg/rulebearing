# testbeds/init: `rulebearing init --dry-run` on jasontaylordev/CleanArchitecture at 1d71eefc5ccf9a5e9b2db86e4cf08070148c7bb4
# (a cruise of src with this configuration exits 0 (89 findings baselined)). Regenerate with testbeds/init/run.sh.
# rulebearing.yaml, written by `rulebearing init` on 2026-09-21.
# Found: .NET.
# Every rule says why it exists (comment) and what to do when it fires (fix);
# `rulebearing explain <rule>` prints both. The rules of rulebearing:recommended apply too.
extends: [rulebearing:dotnet, rulebearing:recommended]
rules:
  dependencies:
    forbidden:
      - name: no-orphans
        from:
          orphan: true
          pathNot:
            - "(^|/)(Program|Startup|AssemblyInfo)\\.cs$"
            - "(^|/)Migrations/"
            - "(^|/)(src/)?(main|index|cli|server|app)\\.[cm]?[jt]sx?$"
            - "(^|/)(scripts|tools|bin)/"
      - name: domain-not-to-outer-layers
        comment: "Domain is an inner layer: it never depends on Application, Infrastructure, Web, which depend on it."
        fix: "Declare what Domain needs as an abstraction in Domain and implement it in the outer layer; never add a ProjectReference from Domain to Application, Infrastructure, Web."
        severity: error
        from: { language: dotnet, namespace: "^CleanArchitecture\\.Domain(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
        to: { namespace: "^CleanArchitecture\\.(Application|Infrastructure|Web)(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
      - name: application-not-to-outer-layers
        comment: "Application is an inner layer: it never depends on Infrastructure, Web, which depend on it."
        fix: "Declare what Application needs as an abstraction in Application and implement it in the outer layer; never add a ProjectReference from Application to Infrastructure, Web."
        severity: error
        from: { language: dotnet, namespace: "^CleanArchitecture\\.Application(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
        to: { namespace: "^CleanArchitecture\\.(Infrastructure|Web)(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
      - name: infrastructure-not-to-outer-layers
        comment: "Infrastructure is an inner layer: it never depends on Web, which depend on it."
        fix: "Declare what Infrastructure needs as an abstraction in Infrastructure and implement it in the outer layer; never add a ProjectReference from Infrastructure to Web."
        severity: error
        from: { language: dotnet, namespace: "^CleanArchitecture\\.Infrastructure(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
        to: { namespace: "^CleanArchitecture\\.Web(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
options:
  # Findings present when this file was written. Each expires; fix it before then.
  knownViolations:
    # no-circular: 3, no-orphans: 1, not-to-unresolvable: 85 (entries elided)
