        fix: "Move what social_auth needs from them down into social_auth (or a package below it), or have the caller pass it in."
        severity: error
        from: { path: "^src/social_auth/" }
        to: { path: "^src/apigw/" }
      - name: sudo-not-to-its-dependents
        comment: "apigw, flagpole, sentry, social_auth import sudo, so it sits below them: sudo importing one of them back would make a cycle between top-level packages."
        fix: "Move what sudo needs from them down into sudo (or a package below it), or have the caller pass it in."
