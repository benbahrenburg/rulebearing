# rulebearing.yaml, written by `rulebearing init` on 2026-09-21.
# Found: TypeScript, Python, jest.
# Every rule says why it exists (comment) and what to do when it fires (fix);
# `rulebearing explain <rule>` prints both. The rules of rulebearing:recommended apply too.
extends: rulebearing:recommended
languages:
  typescript:
    tsConfig: { fileName: tsconfig.json }
    tsPreCompilationDeps: true
rules:
  dependencies:
    forbidden:
      - name: no-orphans
        from:
          orphan: true
          pathNot:
            - "(^|/)\\.[^/]+\\.(js|cjs|mjs|ts|cts|mts|json)$"
            - "\\.d\\.(c|m)?ts$"
            - "(^|/)tsconfig\\.json$"
            - "(^|/)(babel|webpack|vite|vitest|jest|eslint|prettier|next|rollup|tsup)\\.config\\.(js|cjs|mjs|ts|cts|mts|json)$"
            - "(^|/)(Program|Startup|AssemblyInfo)\\.cs$"
            - "(^|/)Migrations/"
            - "(^|/)__main__\\.py$"
            - "(^|/)conftest\\.py$"
            - "(^|/)(src/)?(main|index|cli|server|app)\\.[cm]?[jt]sx?$"
            - "(^|/)(scripts|tools|bin)/"
            - "\\.(spec|test)\\.[cm]?[jt]sx?$"
            - "(^|/)__tests__/"
      - name: bitfield-not-to-its-dependents
        comment: "apigw, flagpole, sentry, social_auth import bitfield, so it sits below them: bitfield importing one of them back would make a cycle between top-level packages."
        fix: "Move what bitfield needs from them down into bitfield (or a package below it), or have the caller pass it in."
        severity: error
        from: { path: "^src/bitfield/" }
        to: { path: "^(src/apigw|src/flagpole|src/sentry|src/social_auth)/" }
      - name: django_picklefield-not-to-its-dependents
        comment: "apigw, flagpole, sentry, social_auth import django_picklefield, so it sits below them: django_picklefield importing one of them back would make a cycle between top-level packages."
        fix: "Move what django_picklefield needs from them down into django_picklefield (or a package below it), or have the caller pass it in."
        severity: error
        from: { path: "^src/django_picklefield/" }
        to: { path: "^(src/apigw|src/flagpole|src/sentry|src/social_auth)/" }
      - name: flagpole-not-to-its-dependents
