extends: [rulebearing:dotnet, rulebearing:recommended]
languages:
  dotnet: {}
rules:
  dependencies:
    forbidden:
      - name: no-orphans
        from:
          orphan: true
          pathNot:
            - "(^|/)(Program|Startup|AssemblyInfo)\\.cs$"
            - "(^|/)Migrations/"
            - "(^|/)(src/)?(main|index|cli|server|app)\\.[cm]?[jt]sx?$"
            - "(^|/)(scripts|tools|bin)/"
      - name: domain-not-to-outer-layers-in-volo-abp
        comment: "Domain is an inner layer: it never depends on Application, which depend on it."
        fix: "Declare what Domain needs as an abstraction in Domain and implement it in the outer layer; never add a ProjectReference from Domain to Application."
        severity: error
        from: { language: dotnet, namespace: "^Volo\\.Abp\\.Domain(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
        to: { namespace: "^Volo\\.Abp\\.Application(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
      - name: domain-not-to-outer-layers-in-volo-abp-testapp
        comment: "Domain is an inner layer: it never depends on Application, which depend on it."
        fix: "Declare what Domain needs as an abstraction in Domain and implement it in the outer layer; never add a ProjectReference from Domain to Application."
        severity: error
        from: { language: dotnet, namespace: "^Volo\\.Abp\\.TestApp\\.Domain(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
        to: { namespace: "^Volo\\.Abp\\.TestApp\\.Application(\\.|$)", namespaceNot: "(^|\\.)[A-Za-z0-9_]*Tests?(\\.|$)" }
