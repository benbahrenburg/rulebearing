# rulebearing.yaml, written by `rulebearing init` on 2026-09-21.
# Found: .NET (dotnet/SK-dotnet.slnx), Python (python).
# Every rule says why it exists (comment) and what to do when it fires (fix);
# `rulebearing explain <rule>` prints both. The rules of rulebearing:recommended apply too.
extends: rulebearing:recommended
languages:
  dotnet: { solution: "dotnet/SK-dotnet.slnx" }
  python:
    roots: ["python"]
rules:
  dependencies:
    forbidden:
      - name: no-orphans
        from:
          orphan: true
          pathNot:
            - "(^|/)\\.[^/]+\\.(js|cjs|mjs|ts|cts|mts|json)$"
            - "\\.d\\.(c|m)?ts$"
            - "(^|/)tsconfig\\.json$"
            - "(^|/)(babel|webpack|vite|vitest|jest|eslint|prettier|next|rollup|tsup)\\.config\\.(js|cjs|mjs|ts|cts|mts|json)$"
            - "(^|/)(Program|Startup|AssemblyInfo)\\.cs$"
            - "(^|/)Migrations/"
            - "(^|/)__main__\\.py$"
            - "(^|/)conftest\\.py$"
            - "(^|/)(src/)?(main|index|cli|server|app)\\.[cm]?[jt]sx?$"
            - "(^|/)(scripts|tools|bin)/"
      - name: samples-not-to-its-dependents
        comment: "tests import samples, so it sits below them: samples importing one of them back would make a cycle between top-level packages."
        fix: "Move what samples needs from them down into samples (or a package below it), or have the caller pass it in."
        severity: error
        from: { path: "^python/samples/" }
        to: { path: "^python/tests/" }
      - name: semantic_kernel-not-to-its-dependents
        comment: "samples, tests import semantic_kernel, so it sits below them: semantic_kernel importing one of them back would make a cycle between top-level packages."
        fix: "Move what semantic_kernel needs from them down into semantic_kernel (or a package below it), or have the caller pass it in."
        severity: error
        from: { path: "^python/semantic_kernel/" }
        to: { path: "^(python/samples|python/tests)/" }
options:
  # Findings present when this file was written. Each expires; fix it before then.
  knownViolations:
    # no-circular: 613, no-orphans: 81, not-to-unresolvable: 2351 (entries elided)
