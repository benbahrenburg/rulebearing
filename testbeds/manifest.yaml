# Open-source test beds, from docs/artifacts/design.md#test-beds-open-source-repositories-to-validate-against,
# plus the maintainer's own repositories (role own, docs/prd.md#nfr-adopt-02).
# Plan: docs/plans/pending/0000-wave-0-spike.md, Step 7 and § 1.5. Runner: testbeds/run.sh.
#
# Fields: repo, sha (pinned by testbeds/pin.sh), role (oracle | greenfield | scale | own), languages,
# tool (the incumbent: dependency-cruiser | netarchtest | archunitnet | import-linter | none), and per
# tool: config (dependency-cruiser config, repository-relative), solution and test (.NET: the solution
# Spike B builds and the architecture-test project the incumbent runs), dir (import-linter: the package
# folder holding the contracts, default the root). For the oracle harness (testbeds/oracles/, plan
# 0002 Step 11): tests (.NET: the folder of architecture tests `import archunit` reads, default the
# test project's folder), filter (.NET: a `dotnet test --filter` selecting those tests), pip
# (import-linter: packages import-linter needs beside the repository's own source, a root package
# that is installed rather than in the repository or a custom contract type's dependency),
# translation (import-linter: a hand translation under testbeds/oracles/configs/ used instead of
# the import). A row whose tool is none has
# nothing to run until the Rulebearing column exists (wave 1), so the runner records it without cloning.
# Every repository is a read-only test bed; nothing from it is committed.
