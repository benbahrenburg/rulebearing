    - name: commands-and-queries-are-records-public-nested-sealed-and-named-command-query
      comment: "imported from src/Content/Backend/Solution/Monaco.Template.Backend.ArchitectureTests/ApplicationTests.cs:86"
      fix: "A command or query is a public sealed record named Command or Query, nested in its feature class. Make it a public sealed record with that name inside the feature."
      select:
        kind: class
        language: dotnet
        where:
          all:
            - any:
                - implementInterface: [MediatR.IRequest]
                - implementInterface: ["MediatR.IRequest`1"]
            - areNotAbstract: true
      should:
        any:
          - all:
              - be:
                  kind: type
                  where:
                    resideInAssembly: Monaco.Template.Backend.Application
              - beRecord: true
              - bePublic: true
              - beNested: true
              - beSealed: true
              - haveName: Command
          - haveName: Query
