# The `rulebearing` wheels on PyPI: one per platform tag, each carrying the binary for that
# platform and a console script that runs it (docs/adr/0020-single-name-across-registries.md).
# hatch_build.py stamps the release version and bundles the binary; docs/release.md says how the
# release workflow builds, checks and publishes them.
# Plan: docs/plans/pending/0002-wave-2-dotnet-python-element-rules.md, Step 14 (2H).
# Lint, type-check and test configuration is the root pyproject.toml.
[build-system]
requires = ["hatchling>=1.26", "packaging>=24"]
build-backend = "hatchling.build"

[project]
name = "rulebearing"
dynamic = ["version"]
description = "One architecture rule set for TypeScript, .NET and Python: deterministic guardrails an agent can check its own changes against"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["architecture", "dependencies", "boundaries", "lint", "import-linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
rulebearing = "rulebearing._launcher:console"

[project.urls]
Homepage = "https://github.com/benbahrenburg/rulebearing"
Repository = "https://github.com/benbahrenburg/rulebearing"
Issues = "https://github.com/benbahrenburg/rulebearing/issues"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebearing"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
