# The fixture of eslint-plugin-rulebearing's agreement test (plan 0002, Step 13): each rule has
# violations the gate's junit reporter and the ESLint rule must word identically.
forbidden:
  - name: ui-not-to-db
    severity: error
    comment: The UI reaches data through services.
    fix: Import from src/services instead of src/db.
    from: { path: "^src/ui/" }
    to: { path: "^src/db/" }
  - name: api-not-to-db
    severity: error
    fix: The API re-exports services, never the data layer.
    from: { path: "^src/api/" }
    to: { path: "^src/db/" }
  - name: no-legacy
    severity: error
    from: { path: "^src/" }
    to: { path: "^src/legacy/" }
  - name: services-not-to-ui
    severity: warn
    fix: Services never depend on the UI.
    from: { path: "^src/services/" }
    to: { path: "^src/ui/" }
