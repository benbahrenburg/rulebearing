# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Domain/PlantUml/ClassDiagramAssociationTest.cs by hand: each ClassDiagramAssociation assertion is an association case
source: ArchUnitNETTests/Domain/PlantUml/ClassDiagramAssociationTest.cs
architecture: [TestAssembly]
cases:
- id: GetNamespaceIdentifierAssociatedWithClass#1
  query: the namespace identifiers of SomeOriginClass's component
  csharp: Assert.Equal(expectedNamespaceIdentifier, classDiagramAssociation.GetNamespaceIdentifiersFromComponentOf(clazz).Single())
  family: association
  object: TestAssembly.Diagram.SimpleDependency.Origin.SomeOriginClass
  ask: namespaceIdentifiers
  diagram: |
    @startuml
    [A] <<TestAssembly.Diagram.SimpleDependency.Origin>>
    [B] <<.*.Noclasshere>>
    @enduml
  rule: {}
  expect:
    value: [TestAssembly.Diagram.SimpleDependency.Origin]
- id: GetTargetNamespaceIdentifierOfClass#1
  query: the namespace identifiers of the components SomeOriginClass's component depends on
  csharp: Assert.Equal(new[] { expectedTarget1, expectedTarget2 }, classDiagramAssociation.GetTargetNamespaceIdentifiers(clazz).OrderBy(s => s).ToList())
  family: association
  object: TestAssembly.Diagram.SimpleDependency.Origin.SomeOriginClass
  ask: targetNamespaceIdentifiers
  diagram: |
    @startuml
    [A] <<.*.Origin>>
    [B] <<.*.Target1>>
    [C] <<.*.Target2>>
    [A] --> [B]
    [A] --> [C]
    @enduml
  rule: {}
  expect:
    value: [.*.Target1, .*.Target2]
- id: RejectsClassNotContainedInAnyComponent#1
  query: the target namespace identifiers of System.Object, in no component
  csharp: Assert.Throws<InvalidOperationException>(() => classDiagramAssociation.GetTargetNamespaceIdentifiers(classNotContained)); Assert.Equal(string.Format("Class {0} is not contained in any component", typeof(object).Name), exception.Message)
  family: association
  object: System.Object
  ask: targetNamespaceIdentifiers
  diagram: |
    @startuml
    [SomeComponent] <<.*.SomeStereotype.>>
    @enduml
  rule: {}
  expect: {error: InvalidOperationException, message: Class Object is not contained in any component}
- id: ReportsIfClassIsContainedInAnyComponent#1
  query: whether System.Object lies in a component
  csharp: Assert.True(classDiagramAssociation.Contains(Architecture.GetClassOfType(typeof(object))), "association contains " + typeof(object).Name)
  family: association
  object: System.Object
  ask: contains
  diagram: |
    @startuml
    [Object] <<System>>
    @enduml
  rule: {}
  expect: {value: true}
- id: ReportsIfClassIsContainedInAnyComponent#2
  query: whether TestAssembly.Class2 lies in a component
  csharp: Assert.False(classDiagramAssociation.Contains(Architecture.GetClassOfType(typeof(Class2))), "association contains " + typeof(Class2).Name)
  family: association
  object: TestAssembly.Class2
  ask: contains
  diagram: |
    @startuml
    [Object] <<System>>
    @enduml
  rule: {}
  expect: {value: false}
- id: ClassResidesInMultipleNamespaces#1
  query: the target namespace identifiers of a class in two components
  csharp: Assert.Throws<ComponentIntersectionException>(() => classDiagramAssociation.GetTargetNamespaceIdentifiers(classContainedInTwoComponents)); Assert.Equal(string.Format("Class {0} may not be contained in more than one component, but is contained in [A, B]", typeof(ClassInFooAndBarNamespace).Name), exception.Message)
  family: association
  object: TestAssembly.Diagram.ConfusingNamespaceNames.FooNamespace.BarNamespace.ClassInFooAndBarNamespace
  ask: targetNamespaceIdentifiers
  diagram: |
    @startuml
    [A] <<.*.FooNamespace.*>>
    [B] <<.*.BarNamespace.*>>
    @enduml
  rule: {}
  expect: {error: ComponentIntersectionException, message: 'Class ClassInFooAndBarNamespace may not be contained in more than one component, but is contained in [A, B]'}
- id: RejectsDuplicateStereotype#1
  query: associating a diagram whose components share a stereotype
  csharp: Assert.Throws<IllegalDiagramException>(() => CreateAssociation(memoryStream)); Assert.Equal("Stereotype '.*.Identical.*' should be unique", exception.Message)
  family: association
  object: TestAssembly.Diagram.ConfusingNamespaceNames.FooNamespace.BarNamespace.ClassInFooAndBarNamespace
  ask: contains
  diagram: |
    @startuml
    [first] <<.*.Identical.*>>
    [second] <<.*.Identical.*>>
    @enduml
  rule: {}
  expect: {error: IllegalDiagramException, message: Stereotype '.*.Identical.*' should be unique}
