# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Fluent/FreezeTests.cs by hand: its assertions are C# (Check throwing or not), with no Verify snapshot for port.py to read.
# FreezingArchRule passes when every object the rule fails is in its violation store. The stores upstream checks in
# (ArchUnitNETTests/ArchUnitNET/Storage/FrozenRules.json and CustomPathFrozenRules.json, keyed by rule description) are translated
# into Rulebearing known-violations files under conformance/archunitnet/baselines/, keyed by rule name (the C# field names):
# one element entry per stored type (`to`), one slice entry per stored slice (`from`). A rule frozen with no violations has no entries.
# Freeze(rule, path) is `--ignore-known <path>`; the default store is the default file. The XmlViolationStore tests stay unported
# (unported.json gives the reason). `passes` is Check not throwing: no finding left at severity error once the file is applied.
source: ArchUnitNETTests/Fluent/FreezeTests.cs
cases:
- id: PassFrozenRules#1
  family: baseline
  architecture: [ArchUnitNETTests]
  query: Freeze(Types that are "ArchUnitNETTests.Fluent.FreezeTests+Violation" or "ArchUnitNETTests.Fluent.FreezeTests+Violation2" should not be private)
  csharp: Freeze(_frozenRule).Check(Architecture) does not throw
  ruleFamily: element
  baselineRule: _frozenRule
  rule:
    select:
      kind: type
      where:
        are: [ArchUnitNETTests.Fluent.FreezeTests+Violation, ArchUnitNETTests.Fluent.FreezeTests+Violation2]
    should: {notBePrivate: true}
  knownViolations: FrozenRules.json
  expect: {passes: true}
- id: PassFrozenRules#2
  family: baseline
  architecture: [ArchUnitNETTests]
  query: Freeze(Types that are "ArchUnitNETTests.Fluent.FreezeTests+Violation" should be protected)
  csharp: Freeze(_frozenRule2).Check(Architecture) does not throw
  ruleFamily: element
  baselineRule: _frozenRule2
  rule:
    select:
      kind: type
      where:
        are: [ArchUnitNETTests.Fluent.FreezeTests+Violation]
    should: {beProtected: true}
  knownViolations: FrozenRules.json
  expect: {passes: true}
- id: PassFrozenRules#3
  family: baseline
  architecture: [TestAssembly]
  query: Freeze(Slices matching "TestAssembly.Slices.(**)" should not depend on each other)
  csharp: Freeze(_frozenSliceRule).Check(StaticTestArchitectures.ArchUnitNETTestAssemblyArchitecture) does not throw
  ruleFamily: slice
  baselineRule: _frozenSliceRule
  rule: {matching: 'TestAssembly.Slices.(**)', should: notDependOnEachOther}
  knownViolations: FrozenRules.json
  expect: {passes: true}
- id: FailFrozenRule#1
  family: baseline
  architecture: [ArchUnitNETTests]
  query: Freeze(Types that are "ArchUnitNETTests.Fluent.FreezeTests+Violation" or "ArchUnitNETTests.Fluent.FreezeTests+Violation2" should be public)
  csharp: Assert.Throws<FailedArchRuleException>(() => Freeze(_failingFrozenRule).Check(Architecture))
  ruleFamily: element
  baselineRule: _failingFrozenRule
  rule:
    select:
      kind: type
      where:
        are: [ArchUnitNETTests.Fluent.FreezeTests+Violation, ArchUnitNETTests.Fluent.FreezeTests+Violation2]
    should: {bePublic: true}
  knownViolations: FrozenRules.json
  expect: {passes: false}
- id: FailFrozenRule#2
  family: baseline
  architecture: [TestAssembly]
  query: Freeze(Slices matching "TestAssembly.Slices.(*).." should not depend on each other)
  csharp: Assert.Throws<FailedArchRuleException>(() => Freeze(_failingFrozenSliceRule).Check(StaticTestArchitectures.ArchUnitNETTestAssemblyArchitecture))
  ruleFamily: slice
  baselineRule: _failingFrozenSliceRule
  rule: {matching: 'TestAssembly.Slices.(*)..', should: notDependOnEachOther}
  knownViolations: FrozenRules.json
  expect: {passes: false}
- id: PassFrozenRulesWithCustomViolationStorePath#1
  family: baseline
  architecture: [ArchUnitNETTests]
  query: Freeze(Types that are "ArchUnitNETTests.Fluent.FreezeTests+Violation" or "ArchUnitNETTests.Fluent.FreezeTests+Violation2" should not be private, "CustomPathFrozenRules.json")
  csharp: Freeze(_frozenRule, "../../../ArchUnitNET/Storage/CustomPathFrozenRules.json").Check(Architecture) does not throw
  ruleFamily: element
  baselineRule: _frozenRule
  rule:
    select:
      kind: type
      where:
        are: [ArchUnitNETTests.Fluent.FreezeTests+Violation, ArchUnitNETTests.Fluent.FreezeTests+Violation2]
    should: {notBePrivate: true}
  knownViolations: CustomPathFrozenRules.json
  expect: {passes: true}
