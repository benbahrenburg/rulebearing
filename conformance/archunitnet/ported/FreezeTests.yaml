  query: Freeze(Types that are "ArchUnitNETTests.Fluent.FreezeTests+Violation" should be protected, "CustomPathFrozenRules.json")
  csharp: Freeze(_frozenRule2, "../../../ArchUnitNET/Storage/CustomPathFrozenRules.json").Check(Architecture) does not throw
  ruleFamily: element
