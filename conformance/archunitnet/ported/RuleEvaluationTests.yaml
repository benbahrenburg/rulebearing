# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Fluent/RuleEvaluationTests.cs by hand: its assertions are C#, with no Verify snapshot for port.py to read.
# The three tests assert each rule's verdict and ArchUnitNET's failure message; the verdicts are ported, and the message is the text of
# FailedArchRuleException, which Rulebearing's reporters replace (coverage tab, Combinators: Check and Evaluate map to cruise and its reporters).
# WrongArchRule4.And(WrongArchRule8) combines two failing rules over different selections: two rules here, WrongArchRule4 and WrongArchRule8.
source: ArchUnitNETTests/Fluent/RuleEvaluationTests.cs
architecture:
- ArchUnitNETTests
cases:
- id: AssertArchRuleTest#1
  alsoCovers:
  - CheckArchRuleTest#1
  - CreateErrorMessageTest#1
  query: 'TrueArchRule1: Classes().That().ArePrivate().Should().BePrivate()'
  csharp: ArchRuleAssert.CheckRule(Architecture, TrueArchRule1)  // Classes().That().ArePrivate().Should().BePrivate()
  rule:
    select:
      kind: class
      where:
        arePrivate: true
    should:
      bePrivate: true
  expect:
    passes: true
- id: AssertArchRuleTest#2
  alsoCovers:
  - CheckArchRuleTest#2
  - CreateErrorMessageTest#2
  query: 'TrueArchRule2: Members().Should().Exist()'
  csharp: ArchRuleAssert.CheckRule(Architecture, TrueArchRule2)  // Members().Should().Exist()
  rule:
    select:
      kind: member
    should:
      exist: true
  expect:
    passes: true
- id: AssertArchRuleTest#3
  alsoCovers:
  - CheckArchRuleTest#3
  - CreateErrorMessageTest#3
  query: 'WrongArchRule1: Classes().That().Are(PublicTestClass).Should().BePrivate()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule1)  // Classes().That().Are(PublicTestClass).Should().BePrivate()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      bePrivate: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#4
  alsoCovers:
  - CheckArchRuleTest#4
  - CreateErrorMessageTest#4
  query: 'WrongArchRule2: Classes().That().Are(PublicTestClass).Should().BePrivate().AndShould().BePublic()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule2)  // Classes().That().Are(PublicTestClass).Should().BePrivate().AndShould().BePublic()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      all:
      - bePrivate: true
      - bePublic: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#5
  alsoCovers:
  - CheckArchRuleTest#5
  - CreateErrorMessageTest#5
  query: 'WrongArchRule3: Classes().That().Are(PublicTestClass).Should().BePrivate().AndShould().BePublic().OrShould().BeProtected()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule3)  // Classes().That().Are(PublicTestClass).Should().BePrivate().AndShould().BePublic().OrShould().BeProtected()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      any:
      - all:
        - bePrivate: true
        - bePublic: true
      - beProtected: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#6
  alsoCovers:
  - CheckArchRuleTest#6
  - CreateErrorMessageTest#6
  query: 'WrongArchRule4: Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().Exist()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule4)  // Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().Exist()
  rule:
    select:
      kind: class
      where:
        haveName: NotTheNameOfAnyClass_1592479214
    should:
      exist: true
  expect:
    passes: false
- id: AssertArchRuleTest#7
  alsoCovers:
  - CheckArchRuleTest#7
  - CreateErrorMessageTest#7
  query: 'WrongArchRule5: Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().BePrivate().AndShould().Exist()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule5)  // Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().BePrivate().AndShould().Exist()
  rule:
    select:
      kind: class
      where:
        haveName: NotTheNameOfAnyClass_1592479214
    should:
      all:
      - bePrivate: true
      - exist: true
  expect:
    passes: false
- id: AssertArchRuleTest#8
  alsoCovers:
  - CheckArchRuleTest#8
  - CreateErrorMessageTest#8
  query: 'WrongArchRule6: Classes().That().Are(PublicTestClass).Should().NotExist()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule6)  // Classes().That().Are(PublicTestClass).Should().NotExist()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      notExist: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#9
  alsoCovers:
  - CheckArchRuleTest#9
  - CreateErrorMessageTest#9
  query: 'WrongArchRule7: Classes().That().Are(PublicTestClass).Should().NotExist().AndShould().BePublic()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule7)  // Classes().That().Are(PublicTestClass).Should().NotExist().AndShould().BePublic()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      all:
      - notExist: true
      - bePublic: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#10
  alsoCovers:
  - CheckArchRuleTest#10
  - CreateErrorMessageTest#10
  query: 'WrongArchRule8: Classes().That().Are(PublicTestClass).Should().NotExist().OrShould().BePrivate()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule8)  // Classes().That().Are(PublicTestClass).Should().NotExist().OrShould().BePrivate()
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      any:
      - notExist: true
      - bePrivate: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#11
  alsoCovers:
  - CheckArchRuleTest#11
  - CreateErrorMessageTest#11
  query: 'WrongArchRule1AndWrongArchRule3: WrongArchRule1.And(WrongArchRule3), both over Classes that are PublicTestClass'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule1AndWrongArchRule3)  // WrongArchRule1.And(WrongArchRule3), both over Classes that are PublicTestClass
  rule:
    select:
      kind: class
      where:
        are:
        - ArchUnitNETTests.Domain.PublicTestClass
    should:
      all:
      - bePrivate: true
      - any:
        - all:
          - bePrivate: true
          - bePublic: true
        - beProtected: true
  expect:
    pass: []
    fail:
    - ArchUnitNETTests.Domain.PublicTestClass
- id: AssertArchRuleTest#12
  query: 'WrongArchRule9: Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().BePrivate()'
  csharp: ArchRuleAssert.CheckRule(Architecture, WrongArchRule9)  // Classes().That().HaveName("NotTheNameOfAnyClass_1592479214").Should().BePrivate()
  rule:
    select:
      kind: class
      where:
        haveName: NotTheNameOfAnyClass_1592479214
    should:
      bePrivate: true
  expect:
    vacuous: true
