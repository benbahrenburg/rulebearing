# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Fluent/Syntax/DependenciesToOtherAssembliesTests.cs by hand: its assertions are C#, with no Verify snapshot for port.py to read.
# The architecture loads ArchUnitNETTests alone; the TestAssembly types it depends on are referenced types, read from the TestAssembly.dll beside it as ArchUnitNET resolves them.
source: ArchUnitNETTests/Fluent/Syntax/DependenciesToOtherAssembliesTests.cs
architecture:
- ArchUnitNETTests
cases:
- id: DependOnAnyTypesThatTest#1
  query: Types that are "ArchUnitNETTests.Fluent.Syntax.DependingClass" should dependOnAnyTypesThat are "TestAssembly.DependencyTargets.ClassInTestAssembly"
  csharp: Types().That().Are(typeof(DependingClass)).Should().DependOnAnyTypesThat().Are(typeof(ClassInTestAssembly)).Check(Architecture)
  rule:
    select:
      kind: type
      where:
        are:
        - ArchUnitNETTests.Fluent.Syntax.DependingClass
    should:
      dependOnAnyTypesThat:
        kind: type
        where:
          are:
          - TestAssembly.DependencyTargets.ClassInTestAssembly
  expect:
    pass:
    - ArchUnitNETTests.Fluent.Syntax.DependingClass
    fail: []
