# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Fluent/MultipleConditionRulesTests.cs by hand: its assertions are C#, with no Verify snapshot for port.py to read.
# The assertion is on which objects pass and fail, so it is a pass/fail case.
source: ArchUnitNETTests/Fluent/MultipleConditionRulesTests.cs
architecture:
- ArchUnitNETTests
cases:
- id: AssignCorrectTypeToEvaluationResults#1
  query: Classes that are PassingClass1, FailingClass or PassingClass2 and are not private should have any attributes Test1 and should have any attributes Test2
  csharp: Classes().That().Are(typeof(PassingClass1), typeof(FailingClass), typeof(PassingClass2)).And().AreNotPrivate().Should().HaveAnyAttributes(typeof(Test1)).AndShould().HaveAnyAttributes(typeof(Test2)).Evaluate(Architecture)
  rule:
    select:
      kind: class
      where:
        all:
        - are:
          - ArchUnitNETTests.Fluent.PassingClass1
          - ArchUnitNETTests.Fluent.FailingClass
          - ArchUnitNETTests.Fluent.PassingClass2
        - areNotPrivate: true
    should:
      all:
      - haveAnyAttributes:
        - ArchUnitNETTests.Fluent.Test1
      - haveAnyAttributes:
        - ArchUnitNETTests.Fluent.Test2
  expect:
    pass:
    - ArchUnitNETTests.Fluent.PassingClass1
    - ArchUnitNETTests.Fluent.PassingClass2
    fail:
    - ArchUnitNETTests.Fluent.FailingClass
