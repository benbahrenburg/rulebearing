# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Domain/PlantUml/PlantUmlParserTest.cs by hand: each parse assertion is a plantuml case over the diagram TestDiagram writes
source: ArchUnitNETTests/Domain/PlantUml/PlantUmlParserTest.cs
cases:
- id: ParsesCorrectNumberOfComponents#1
  query: the diagram's components
  csharp: Assert.Equal(2, diagram.AllComponents.Count)
  family: plantuml
  diagram: |
    @startuml
    [SomeOrigin] <<Origin.*>>
    [SomeTarget] <<Target.*>>
    @enduml
  rule: {}
  expect:
    components:
    - name: SomeOrigin
      stereotypes: [Origin.*]
    - name: SomeTarget
      stereotypes: [Target.*]
- id: ParsesASimpleComponent#1
  alsoCovers: [ParsesASimpleComponentWithFile#1]
  query: the one component's stereotypes and alias
  csharp: Assert.Equal(origin.Stereotypes.SingleOrDefault(), new Stereotype("Origin.*")); Assert.Null(origin.Alias)
  family: plantuml
  diagram: |
    @startuml
    [SomeOrigin] <<Origin.*>>
    @enduml
  rule: {}
  expect:
    components:
    - name: SomeOrigin
      stereotypes: [Origin.*]
- id: ParsesDependencyOfSimpleComponentDiagram#1
  query: SomeOrigin's one dependency, SomeTarget, with no dependency, its stereotype and no alias
  csharp: Assert.Equal(target.ComponentName, new ComponentName("SomeTarget")); Assert.Empty(target.Dependencies); Assert.Equal(new Stereotype("Target.*"), target.Stereotypes.Single()); Assert.Null(target.Alias)
  family: plantuml
  diagram: |
    @startuml
    [SomeOrigin] <<Origin.*>>
    [SomeTarget] <<Target.*>>
    [SomeOrigin] --> [SomeTarget]
    @enduml
  rule: {}
  expect:
    components:
    - name: SomeOrigin
      stereotypes: [Origin.*]
    - name: SomeTarget
      stereotypes: [Target.*]
    dependenciesOf:
      SomeOrigin: [SomeTarget]
      SomeTarget: []
- id: ParsesDependencyOfSimpleComponentDiagram#2
  query: SomeOrigin's one dependency, SomeTarget, with no dependency, its stereotype and no alias
  csharp: Assert.Equal(target.ComponentName, new ComponentName("SomeTarget")); Assert.Empty(target.Dependencies); Assert.Equal(new Stereotype("Target.*"), target.Stereotypes.Single()); Assert.Null(target.Alias)
  family: plantuml
  diagram: |
    @startuml
    [SomeOrigin] <<Origin.*>>
    [SomeTarget] <<Target.*>>
    [SomeTarget] <-- [SomeOrigin]
    @enduml
  rule: {}
  expect:
    components:
    - name: SomeOrigin
      stereotypes: [Origin.*]
    - name: SomeTarget
      stereotypes: [Target.*]
    dependenciesOf:
      SomeOrigin: [SomeTarget]
      SomeTarget: []
