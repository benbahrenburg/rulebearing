# Ported from ArchUnitNET 0.13.4 ArchUnitNETTests/Domain/PlantUml/PlantUmlComponentTest.cs by hand: PlantUmlComponent equality is what Distinct() and ToDictionary() over parsed components observe
source: ArchUnitNETTests/Domain/PlantUml/PlantUmlComponentTest.cs
cases:
- id: TwoComponentsWithSameNameStereoTypeAndAliasShouldBeEqual#1
  alsoCovers: [TwoComponentsWithSameNameStereoTypeAndAliasHaveSameHashCode#1]
  query: two components with the same name, stereotype and alias are one (Distinct() compares by GetHashCode, then Equals)
  csharp: Assert.Equal(component1, component2)
  family: plantuml
  diagram: |
    @startuml
    [someName] <<someStereoType>> as someAlias
    [someName] <<someStereoType>> as someAlias
    @enduml
  rule: {}
  expect:
    components:
    - name: someName
      stereotypes: [someStereoType]
      alias: someAlias
- id: TwoNonIdenticalComponentsShouldNotBeEqual#1
  query: two components differing only in name stay two, so their shared alias is a duplicate key (PlantUmlComponents' ToDictionary)
  csharp: Assert.NotEqual(component1, component2)
  family: plantuml
  diagram: |
    @startuml
    [someName1] <<someStereoType>> as someAlias
    [someName2] <<someStereoType>> as someAlias
    @enduml
  rule: {}
  expect: {error: ArgumentException}
