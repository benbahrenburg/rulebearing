- id: DoNotResideInNamespaceContaining_ClassSelected
  csharp: "Types.InAssembly(Assembly.GetAssembly(typeof(ClassA1))).That().ResideInNamespaceStartingWith(\"NetArchTest.TestStructure.NameMatching\").And().DoNotResideInNamespaceContaining(\"Namespace2\").GetTypes()"
  rule:
    select:
