  rule:
    select:
      kind: type
    should:
      any:
        - all:
            - notBeNested: true
            - resideInNamespaceMatching: "^.*.[Nn][Aa][Mm][Ee][Mm][Aa][Tt][Cc][Hh][Ii][Nn][Gg]..*$"
        - all:
            - beNested: true
            - any:
                - bePublic: true
                - bePrivate: true
            - beNestedIn:
                kind: type
                where:
                  haveFullNameMatching: "^.*.[Nn][Aa][Mm][Ee][Mm][Aa][Tt][Cc][Hh][Ii][Nn][Gg]..*$"
  expect:
    pass:
      - NetArchTest.TestStructure.NameMatching.Namespace1.ClassA1
