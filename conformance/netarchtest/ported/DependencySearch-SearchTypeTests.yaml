- id: FindTypesThatOnlyOnlyHaveDependenciesOnAll_Found
  csharp: "Types.InAssembly(Assembly.GetAssembly(typeof(Class_A))).That().ResideInNamespace(typeof(Class_A).Namespace).And().HaveNameStartingWith(\"Class\").GetTypeDefinitions()"
  search: "FindTypesThatOnlyOnlyHaveDependenciesOnAll(typeList, [\"NetArchTest.TestStructure.Dependencies.TypeOfSearch.Dependency_1\", \"NetArchTest.TestStructure.Dependencies.TypeOfSearch.Dependency_2\", \"System\"])"
  note: "The list's System entry matches System.Object, which every class inherits, so the System part of NetArchTest's 'a dependency on every entry' holds for every subject and the rule asks for the other two entries; onlyDependOn ignores dependencies outside the analysed code, and every such dependency of the subjects is on a System type."
  rule:
    select:
      kind: type
      where:
        all:
          - haveFullNameStartingWith: NetArchTest.TestStructure.Dependencies.TypeOfSearch
          - haveNameMatching: "^[Cc][Ll][Aa][Ss][Ss]"
    should:
      all:
        - onlyDependOn:
            kind: type
            where:
              haveFullNameMatching: "^(?:NetArchTest\\.TestStructure\\.Dependencies\\.TypeOfSearch\\.Dependency_1|NetArchTest\\.TestStructure\\.Dependencies\\.TypeOfSearch\\.Dependency_2|System)(?:$|[.+])"
        - all:
            - dependOnAny:
                kind: type
                where:
                  haveFullNameMatching: "^(?:NetArchTest\\.TestStructure\\.Dependencies\\.TypeOfSearch\\.Dependency_1)(?:$|[.+])"
            - dependOnAny:
                kind: type
                where:
                  haveFullNameMatching: "^(?:NetArchTest\\.TestStructure\\.Dependencies\\.TypeOfSearch\\.Dependency_2)(?:$|[.+])"
  expect:
    pass: [NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_G]
    fail:
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_A
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_B
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_C
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_D
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_E
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_F
      - NetArchTest.TestStructure.Dependencies.TypeOfSearch.Class_H
