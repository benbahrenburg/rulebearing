# Spell checking for prose, code and configuration.
# Gate: docs/adr/0025-ci-and-supply-chain-hardening.md. Run: `typos` (or `typos --write-changes`).
[files]
extend-exclude = [
  "target/",
  "node_modules/",
  "package-lock.json",
  "Cargo.lock",
  # Verbatim exports and vendored upstream fixtures are not ours to correct.
  "docs/artifacts/",
  "conformance/*/upstream/",
  "conformance/*/fixtures/",
  # Generated measurement output naming third-party types.
  "conformance/archunitnet/attribution/",
  # Generated by conformance/archunitnet/tools/port.py; carries ArchUnitNET's rule descriptions
  # verbatim, which the upstream snapshots truncate mid-word ("ClassWithGetOnl...").
  "conformance/archunitnet/ported/",
  # Generated from the upstream fixture assemblies; their identifiers are upstream's.
  "conformance/*/graphs/",
  "testbeds/checkouts/",
  # Tool output: compiler command lines, not prose.
  "mutants.out/",
  "mutants.out.old/",
  "lcov.info",
]

[default.extend-words]
# A deliberate misspelling: rb-config's test that an unknown element key is named with the
# nearest known one (`arePublc`, did you mean `arePublic`).
Publc = "Publc"
# Project and ecosystem vocabulary that is not a misspelling.
rulebearing = "rulebearing"
depcruise = "depcruise"
oxc = "oxc"
# The flate2 crate, a candidate for the cache's `compress` option.
flate = "flate"
# Microsoft's Magentic-One agent: the magentic_one_cli package in autogen's init fixture.
magentic = "magentic"

[default.extend-identifiers]
# Yarn Plug'n'Play, spelled PnP throughout dependency-cruiser's options and this project's docs.
PnP = "PnP"
pnp = "pnp"
# NetArchTest 1.3.2's own identifiers, quoted verbatim by conformance/netarchtest (the upstream
# test names and the dependency-search parameter they cite).
HaveDepencency_MatchesFound_ClassSelected = "HaveDepencency_MatchesFound_ClassSelected"
HaveDepencencyOnAny_MatchesFound_ClassSelected = "HaveDepencencyOnAny_MatchesFound_ClassSelected"
HaveDepencencyOnAll_MatchesFound_ClassSelected = "HaveDepencencyOnAll_MatchesFound_ClassSelected"
DoNotHaveDepencency_MatchesFound_ClassSelected = "DoNotHaveDepencency_MatchesFound_ClassSelected"
serachForDependencyInFieldConstant = "serachForDependencyInFieldConstant"
