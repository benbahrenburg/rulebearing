# The Rulebearing GitHub Action: downloads the release binary for the runner, checks it against the
# release's SHA256SUMS, and runs `rulebearing cruise` with the given arguments. The step's exit code
# is the cruise's (docs/adr/0008-exit-code-contract.md, docs/adr/0030-the-reporter-decides-the-error-count-exit.md);
# with the default output type, github-annotations, findings appear inline on the pull request.
#
# Contract: docs/plans/pending/0001-wave-1-typescript-parity.md § 1.5 ("The GitHub Action") and Step 19.
# Requirement: docs/prd.md#fr-dist-01. Distribution: docs/architecture.md#distribution.
#
#   - uses: benbahrenburg/rulebearing@v0.1.0
#     with:
#       args: --config rulebearing.yaml src
name: Rulebearing
description: Architecture rules for TypeScript, .NET and Python in one binary and one rule language, checked on every pull request.
author: Ben Bahrenburg
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: The release to run, such as 0.1.0. Default is the version this action was referenced at, else the latest release.
    required: false
    default: ""
  args:
    description: Arguments after `rulebearing cruise`, such as `--config rulebearing.yaml src`.
    required: false
    default: ""
  output-type:
    description: The reporter. github-annotations puts each finding on the line it concerns.
    required: false
    default: github-annotations
  binary:
    description: A rulebearing binary already on the runner, used instead of downloading one (this repository's CI tests the action with its own build).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: install rulebearing
      if: inputs.binary == ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        version="${VERSION:-$ACTION_REF}"
        version="${version#v}"
        case "$RUNNER_OS/$RUNNER_ARCH_NAME" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          macOS/X64) target=x86_64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
          *) echo "::error::rulebearing has no release binary for $RUNNER_OS $RUNNER_ARCH_NAME"; exit 2 ;;
        esac
        if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          base="https://github.com/benbahrenburg/rulebearing/releases/download/v$version"
        else
          base="https://github.com/benbahrenburg/rulebearing/releases/latest/download"
        fi
        dir="$RUNNER_TEMP/rulebearing"
        mkdir -p "$dir"
        archive="rulebearing-$target.tar.gz"
        curl --fail --silent --show-error --location --retry 3 -o "$dir/$archive" "$base/$archive"
        curl --fail --silent --show-error --location --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
        expected="$(awk -v f="$archive" '$2 == f || $2 == "./" f { print $1 }' "$dir/SHA256SUMS")"
        if command -v sha256sum > /dev/null; then
          actual="$(sha256sum "$dir/$archive" | cut -d' ' -f1)"
        else
          actual="$(shasum -a 256 "$dir/$archive" | cut -d' ' -f1)"
        fi
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "::error::$archive does not match the release's SHA256SUMS"
          exit 2
        fi
        tar -xzf "$dir/$archive" -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
    - name: rulebearing cruise
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        OUTPUT_TYPE: ${{ inputs.output-type }}
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        read -r -a extra <<< "$ARGS"
        # The ${x+...} form keeps an empty list working under set -u on macOS's bash 3.2.
        "${BINARY:-rulebearing}" cruise --output-type "$OUTPUT_TYPE" ${extra[@]+"${extra[@]}"}
