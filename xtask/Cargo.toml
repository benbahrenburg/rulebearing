[package]
name = "xtask"
description = "Repository automation: documentation link checking and the one lint entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# No dependencies on purpose. This crate is compiled by rb-model's build script, so every
# `cargo build` and `cargo test` pays for it; the standard library keeps that cost near zero and
# keeps `cargo deny` unaffected (docs/adr/0019-mit-licence.md).

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
