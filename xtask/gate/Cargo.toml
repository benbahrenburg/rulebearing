[package]
name = "xtask-gate"
description = "Carries the documentation link check as a build script that no crate depends on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The build script is the whole of this crate's behaviour. Nothing depends on it, so a re-run
# (any edit under crates/, xtask/, fuzz/ or the documentation) rebuilds this crate alone
# (docs/adr/0058-the-edit-compile-cycle-rebuilds-only-what-changed.md).
build = "build.rs"

[build-dependencies]
xtask = { workspace = true }

[lints]
workspace = true
